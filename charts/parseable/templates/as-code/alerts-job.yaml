{{- $p := .Values.parseable }}
{{- include "parseable.validateAsCodeSection" (dict "values" $p "section" "alerts") }}
{{- include "parseable.validateAsCodeSection" (dict "values" $p "section" "targets") }}
{{- $manageAlerts := and (hasKey $p "alerts") (kindIs "map" $p.alerts) $p.alerts.enabled }}
{{- $manageTargets := and (hasKey $p "targets") (kindIs "map" $p.targets) $p.targets.enabled }}
{{- if and $manageAlerts (not (hasKey $p.alerts "items")) }}{{- fail "parseable.alerts.items is required when enabled is true." }}{{- end }}
{{- if and $manageTargets (not (hasKey $p.targets "items")) }}{{- fail "parseable.targets.items is required when enabled is true." }}{{- end }}
{{- $alerts := list }}
{{- $targets := list }}
{{- if $manageAlerts }}{{- $alerts = $p.alerts.items }}{{- end }}
{{- if $manageTargets }}{{- $targets = $p.targets.items }}{{- end }}
{{- if or $manageAlerts $manageTargets }}
{{- $seenTargetTitles := dict }}
{{- $seenTargetIDs := dict }}
{{- range $index, $item := $targets }}
  {{- $title := default (printf "item %d" $index) $item.title }}
  {{- if or (not $item.title) (not (kindIs "string" $item.title)) (eq (trim $item.title) "") }}
    {{- fail (printf "targets[%d]: title must be a nonempty string" $index) }}
  {{- end }}
  {{- if hasKey $seenTargetTitles $item.title }}
    {{- fail (printf "targets[%d] (%s): duplicate title; already used by targets[%d]" $index $title (get $seenTargetTitles $item.title)) }}
  {{- end }}
  {{- $_ := set $seenTargetTitles $item.title $index }}
  {{- if or (not $item.id) (not (kindIs "string" $item.id)) (not (regexMatch "^[0-7][0-9A-HJKMNP-TV-Z]{25}$" $item.id)) }}
    {{- fail (printf "targets[%d] (%s): id must be a valid 26-character ULID (e.g. 01H7Z0XQ9G6K3JY1F5Z2X8V4E3)" $index $title) }}
  {{- end }}
  {{- if hasKey $seenTargetIDs $item.id }}
    {{- fail (printf "targets[%d] (%s): duplicate id; already used by targets[%d]" $index $title (get $seenTargetIDs $item.id)) }}
  {{- end }}
  {{- $_ := set $seenTargetIDs $item.id $index }}
  {{- if not $item.type }}
    {{- fail (printf "targets[%d] (%s): type is required" $index $title) }}
  {{- end }}
  {{- if or (not $item.endpointSecretRef) (not $item.endpointSecretRef.name) (not $item.endpointSecretRef.key) }}
    {{- fail (printf "targets[%d] (%s): endpointSecretRef.name and endpointSecretRef.key are required" $index $title) }}
  {{- end }}
  {{- if eq $item.type "slack" }}
    {{- if or (hasKey $item "skipTlsCheck") (hasKey $item "customHeaders") (hasKey $item "usernameSecretRef") (hasKey $item "passwordSecretRef") }}
      {{- fail (printf "targets[%d] (%s): slack supports only id, title, type, and endpointSecretRef" $index $title) }}
    {{- end }}
  {{- else if eq $item.type "webhook" }}
    {{- if or (hasKey $item "usernameSecretRef") (hasKey $item "passwordSecretRef") }}
      {{- fail (printf "targets[%d] (%s): webhook does not support AlertManager usernameSecretRef or passwordSecretRef" $index $title) }}
    {{- end }}
  {{- else if eq $item.type "alertManager" }}
    {{- if hasKey $item "customHeaders" }}
      {{- fail (printf "targets[%d] (%s): alertManager does not support customHeaders" $index $title) }}
    {{- end }}
    {{- if ne (hasKey $item "usernameSecretRef") (hasKey $item "passwordSecretRef") }}
      {{- fail (printf "targets[%d] (%s): alertManager needs both usernameSecretRef and passwordSecretRef, or neither" $index $title) }}
    {{- end }}
  {{- end }}
{{- end }}
{{- $alertItems := list }}
{{- $inlineNames := dict }}
{{- $externalNames := dict }}
{{- if $manageAlerts }}
  {{- range $index, $item := $alerts }}
    {{- range $field := keys $item }}
      {{- if not (has $field (list "name" "json" "configMap" "namespace")) }}
        {{- fail (printf "Unknown alerts[%d] field %q. Use name and exactly one of json or configMap; namespace is only valid with configMap." $index $field) }}
      {{- end }}
    {{- end }}
    {{- if and (hasKey $item "name") (not (trim $item.name)) }}{{- fail (printf "alerts[%d]: name cannot be empty." $index) }}{{- end }}
    {{- if eq (hasKey $item "json") (hasKey $item "configMap") }}
      {{- fail (printf "alerts[%d]: set exactly one of json or configMap." $index) }}
    {{- end }}
    {{- if hasKey $item "json" }}
      {{- if hasKey $item "namespace" }}{{- fail (printf "alerts[%d]: namespace is only valid with configMap." $index) }}{{- end }}
      {{- if not (trim $item.json) }}{{- fail (printf "alerts[%d]: json cannot be empty." $index) }}{{- end }}
      {{- if gt (len $item.json) 900000 }}{{- fail (printf "alerts[%d]: inline JSON exceeds 900 KB. Use a separate ConfigMap for this alert." $index) }}{{- end }}
      {{- $cm := include "parseable.inlineAlertConfigMapName" (dict "root" $ "item" $item "index" $index) }}
      {{- if hasKey $inlineNames (printf "%s/%s" $.Release.Namespace $cm) }}{{- fail (printf "alerts[%d]: duplicate inline alert name; each alert needs a unique name or JSON title." $index) }}{{- end }}
      {{- $_ := set $inlineNames (printf "%s/%s" $.Release.Namespace $cm) true }}
      {{- $entry := dict "configMap" $cm "namespace" $.Release.Namespace }}
      {{- if hasKey $item "name" }}{{- $_ := set $entry "name" (trim $item.name) }}{{- end }}
      {{- $alertItems = append $alertItems $entry }}
    {{- else }}
      {{- $cm := trim (default "" $item.configMap) }}
      {{- $ns := trim (default "" $item.namespace) }}
      {{- if not $ns }}{{- fail (printf "alerts[%d]: namespace is required with configMap." $index) }}{{- end }}
      {{- if or (gt (len $cm) 253) (not (regexMatch "^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$" $cm)) }}{{- fail (printf "alerts[%d]: configMap must be a valid Kubernetes ConfigMap name." $index) }}{{- end }}
      {{- range $part := splitList "." $cm }}
        {{- if gt (len $part) 63 }}{{- fail (printf "alerts[%d]: each part of configMap name must be at most 63 characters." $index) }}{{- end }}
      {{- end }}
      {{- if or (not (regexMatch "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$" $ns)) (gt (len $ns) 63) }}{{- fail (printf "alerts[%d]: namespace must be a valid Kubernetes namespace name." $index) }}{{- end }}
      {{- $_ := set $externalNames (printf "%s/%s" $ns $cm) true }}
      {{- $entry := dict "configMap" $cm "namespace" $ns }}
      {{- if hasKey $item "name" }}{{- $_ := set $entry "name" (trim $item.name) }}{{- end }}
      {{- $alertItems = append $alertItems $entry }}
    {{- end }}
  {{- end }}
  {{- range $name := keys $externalNames }}
    {{- if hasKey $inlineNames $name }}{{- fail (printf "ConfigMap %s is generated for an inline alert; choose a different external ConfigMap name." $name) }}{{- end }}
  {{- end }}
{{- end }}
{{- $fullname := include "parseable.fullname" . }}
{{- $target := printf "%s-querier-service" $fullname }}
{{- if eq $p.deploymentMode "standalone" }}
  {{- $target = printf "%s-standalone-service" $fullname }}
{{- else if $p.enterprise.enabled }}
  {{- $target = printf "%s-prism-service" $fullname }}
{{- end }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "%s-alerts-and-targets" (trunc 44 $fullname | trimSuffix "-") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "parseable.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "15"
    "helm.sh/hook-output-log-policy": hook-failed
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded,hook-failed
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 420
  template:
    metadata:
      labels:
        {{- include "parseable.labels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      {{- if $manageAlerts }}
      serviceAccountName: {{ $fullname }}-alert-reader
      {{- else }}
      automountServiceAccountToken: false
      {{- end }}
      securityContext:
        {{- toYaml $p.podSecurityContext | nindent 8 }}
      containers:
        - name: reconcile-alerts
          image: docker.io/library/python:3.12-alpine
          imagePullPolicy: IfNotPresent
          command: ["python", "-c"]
          args:
            - |-
              import base64
              import json
              import os
              import re
              import sys
              import time
              from urllib.error import HTTPError, URLError
              from urllib.parse import quote
              from urllib.request import Request, urlopen

              base = os.environ["PARSEABLE_BASE_URL"].rstrip("/")
              auth = base64.b64encode(
                  f'{os.environ["P_USERNAME"]}:{os.environ["P_PASSWORD"]}'.encode()
              ).decode()
              ulid_pattern = re.compile(r'^[0-7][0-9A-HJKMNP-TV-Z]{25}$')

              TOKEN_PATH = "/var/run/secrets/kubernetes.io/serviceaccount/token"
              CA_PATH = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"

              def read_configmap(namespace, name, token, context):
                  url = (
                      "https://kubernetes.default.svc/api/v1/namespaces/"
                      f"{quote(namespace, safe='')}/configmaps/{quote(name, safe='')}"
                  )
                  req = Request(url, headers={"Authorization": f"Bearer {token}"})
                  try:
                      with urlopen(req, timeout=15, context=context) as response:
                          configmap = json.load(response)
                  except json.JSONDecodeError as error:
                      raise ValueError(f"Kubernetes returned invalid ConfigMap data for {namespace}/{name}") from error
                  except HTTPError as error:
                      if error.code == 404:
                          raise ValueError(f"ConfigMap {namespace}/{name} was not found; create it before running Helm") from error
                      if error.code == 403:
                          raise ValueError(f"cannot read ConfigMap {namespace}/{name}; grant the alert Job get permission in that namespace") from error
                      raise ValueError(f"reading ConfigMap {namespace}/{name} returned HTTP {error.code}") from error
                  except (URLError, TimeoutError) as error:
                      raise ValueError(f"cannot reach Kubernetes API while reading ConfigMap {namespace}/{name}") from error
                  if not isinstance(configmap, dict):
                      raise ValueError(f"Kubernetes returned invalid ConfigMap {namespace}/{name}")
                  data = configmap.get("data") or {}
                  if not isinstance(data, dict) or len(data) != 1 or configmap.get("binaryData"):
                      raise ValueError(f"ConfigMap {namespace}/{name} must have exactly one text entry in data and no binaryData")
                  key, content = next(iter(data.items()))
                  if not isinstance(content, str) or not content.strip():
                      raise ValueError(f"ConfigMap {namespace}/{name} key {key!r} is empty")
                  try:
                      alert = json.loads(content)
                  except (UnicodeError, json.JSONDecodeError) as error:
                      raise ValueError(f"ConfigMap {namespace}/{name} key {key!r} contains invalid alert JSON: {error}") from error
                  if not isinstance(alert, dict):
                      raise ValueError(f"ConfigMap {namespace}/{name} key {key!r} must contain a JSON object")
                  return alert

              def discover_alerts():
                  import ssl

                  items = json.loads(os.environ["ALERT_ITEMS"])
                  if not isinstance(items, list):
                      raise ValueError("alerts must be a list")
                  if not items:
                      return []
                  with open(TOKEN_PATH, encoding="utf-8") as stream:
                      token = stream.read().strip()
                  context = ssl.create_default_context(cafile=CA_PATH)
                  configured = []
                  for item in items:
                      namespace, name = item["namespace"], item["configMap"]
                      alert = read_configmap(namespace, name, token, context)
                      if "name" in item:
                          alert["title"] = item["name"]
                      configured.append((f"ConfigMap {namespace}/{name}", alert))
                  return configured

              def secret_value(title, ref, field, index):
                  if not isinstance(ref, dict) or not ref.get("name") or not ref.get("key"):
                      raise ValueError(f'target {title!r}: {field}SecretRef needs name and key')
                  value = os.environ.get(f'TARGET_{field.upper()}_{index}')
                  if not value:
                      raise ValueError(
                          f'target {title!r}: Secret {ref["name"]!r} has no {ref["key"]!r} field or it is empty'
                      )
                  return value

              def target_from_values(data, index):
                  if not isinstance(data, dict):
                      raise ValueError('each targets entry must be an object')
                  title, kind, id = data.get("title"), data.get("type"), data.get("id")
                  if not isinstance(title, str) or not title.strip():
                      raise ValueError('each targets entry needs a nonempty title')
                  if not isinstance(id, str) or not ulid_pattern.fullmatch(id):
                      raise ValueError(f'target {title!r}: id must be a canonical 26-character ULID starting with 0-7')
                  if kind not in ("slack", "webhook", "alertManager"):
                      raise ValueError(f'target {title!r}: type must be slack, webhook, or alertManager')
                  allowed = {"id", "title", "type", "endpointSecretRef"}
                  if kind == "webhook":
                      allowed.update({"skipTlsCheck", "customHeaders"})
                  elif kind == "alertManager":
                      allowed.update({"skipTlsCheck", "usernameSecretRef", "passwordSecretRef"})
                  unknown = set(data) - allowed
                  if unknown:
                      raise ValueError(f'target {title!r}: unknown field(s): {", ".join(sorted(unknown))}')
                  endpoint = secret_value(title, data.get("endpointSecretRef"), "endpoint", index).strip()
                  if not endpoint:
                      raise ValueError(f'target {title!r}: endpoint Secret field is empty')
                  # The UI calls this field Title; the Parseable API calls it name.
                  target = {"id": id, "name": title, "type": kind, "endpoint": endpoint}
                  if kind != "slack":
                      skip_tls = data.get("skipTlsCheck", False)
                      if not isinstance(skip_tls, bool):
                          raise ValueError(f'target {title!r}: skipTlsCheck must be true or false')
                      target["skipTlsCheck"] = skip_tls
                  if kind == "webhook":
                      headers = data.get("customHeaders", {})
                      if not isinstance(headers, dict) or any(
                          not isinstance(key, str) or not isinstance(value, str)
                          for key, value in headers.items()
                      ):
                          raise ValueError(f'target {title!r}: customHeaders must map keys to string values')
                      if headers:
                          target["headers"] = headers
                  if kind == "alertManager":
                      username_ref = data.get("usernameSecretRef")
                      password_ref = data.get("passwordSecretRef")
                      if bool(username_ref) != bool(password_ref):
                          raise ValueError(f'target {title!r}: usernameSecretRef and passwordSecretRef must be set together')
                      if username_ref:
                          username = secret_value(title, username_ref, "username", index)
                          password = secret_value(title, password_ref, "password", index)
                          if not username.strip() or not password:
                              raise ValueError(f'target {title!r}: AlertManager username and password Secret fields must not be empty')
                          target["username"] = username
                          target["password"] = password
                  return target

              def discover():
                  source_alerts = discover_alerts() if os.environ["ALERTS_ENABLED"] == "true" else []
                  configured_targets = []
                  seen_target_names = set()
                  seen_target_ids = set()
                  for index, data in enumerate(json.loads(os.environ["CONFIGURED_TARGETS"])):
                      target = target_from_values(data, index)
                      if target["name"] in seen_target_names:
                          raise ValueError(f'duplicate target title {target["name"]!r} in values')
                      if target["id"] in seen_target_ids:
                          raise ValueError(f'duplicate target id {target["id"]!r} in values')
                      seen_target_names.add(target["name"])
                      seen_target_ids.add(target["id"])
                      configured_targets.append((target["name"], target))

                  configured_alerts = []
                  if os.environ["ALERTS_ENABLED"] != "true":
                      return configured_targets, configured_alerts
                  seen_titles, seen_alert_ids = set(), set()
                  for source, alert in source_alerts:
                      title = alert.get("title")
                      if not isinstance(title, str) or not title.strip():
                          raise ValueError(f'{source}: alert title is required')
                      alert_id = alert.get("id")
                      if "id" in alert and (not isinstance(alert_id, str) or not ulid_pattern.fullmatch(alert_id)):
                          raise ValueError(f'{source}: alert id must be a canonical 26-character ULID starting with 0-7')
                      if alert_id is not None:
                          if alert_id in seen_alert_ids:
                              raise ValueError(f'duplicate alert id {alert_id!r} in alerts')
                          seen_alert_ids.add(alert_id)
                      if title in seen_titles:
                          raise ValueError(f'duplicate alert title {title!r} in alerts')
                      seen_titles.add(title)
                      target_ids = alert.get("targets")
                      if not isinstance(target_ids, list) or not target_ids or any(
                          not isinstance(target, str) or not ulid_pattern.fullmatch(target) for target in target_ids
                      ):
                          raise ValueError(f'{source}: targets must be a nonempty list of target ULIDs')
                      if len(target_ids) != len(set(target_ids)):
                          raise ValueError(f'{source}: targets contains duplicate target IDs')
                      configured_alerts.append((source, alert))
                  return configured_targets, configured_alerts

              def request(method, endpoint, payload=None):
                  body = None if payload is None else json.dumps(payload).encode()
                  headers = {"Authorization": f"Basic {auth}"}
                  if body is not None:
                      headers["Content-Type"] = "application/json"
                  req = Request(base + endpoint, data=body, headers=headers, method=method)
                  try:
                      with urlopen(req, timeout=30) as response:
                          content = response.read()
                  except HTTPError as error:
                      # A proxy may echo Secret-backed target fields in its response.
                      if method in ("POST", "PUT") and endpoint.startswith("/api/v1/alerts") and error.code == 400:
                          detail = error.read(2048).decode(errors="replace")
                          missing = re.search(r"table ['\"](?:datafusion\.public\.)?([^'\"]+)['\"] not found", detail, re.IGNORECASE)
                          if missing:
                              title = payload.get("title") if isinstance(payload, dict) else None
                              datasets = payload.get("datasets") if isinstance(payload, dict) else None
                              if isinstance(datasets, list) and missing.group(1) in datasets:
                                  issue = f'dataset {missing.group(1)!r} is not available for queries'
                              else:
                                  issue = 'the query references a dataset that is not available for queries'
                              raise ValueError(
                                  f'alert {title!r}: {issue}; '
                                  'check the query and datasets in alert.json, then rerun Helm'
                              ) from error
                      raise ValueError(f'{method} {endpoint}: HTTP {error.code}') from error
                  except URLError as error:
                      raise ValueError(f'{method} {endpoint}: {error.reason}') from error
                  if method == "DELETE":
                      return None
                  return json.loads(content) if content else None

              def existing_alerts():
                  alerts = []
                  offset = 0
                  while True:
                      page = request("GET", f'/api/v1/alerts?offset={offset}&limit=1000')
                      if not isinstance(page, list):
                          raise ValueError('GET /api/v1/alerts returned an unexpected response')
                      alerts.extend(page)
                      if len(page) < 1000:
                          return alerts
                      offset += len(page)

              def wait_for_api():
                  deadline = time.monotonic() + 120
                  url = base + "/api/v1/readiness"
                  while True:
                      try:
                          with urlopen(url, timeout=5):
                              return
                      except (HTTPError, URLError, TimeoutError):
                          if time.monotonic() >= deadline:
                              raise ValueError("Parseable API did not become ready within 120 seconds")
                          time.sleep(5)

              try:
                  configured_targets, configured_alerts = discover()
                  wait_for_api()
                  manage_targets = os.environ["MANAGE_TARGETS"] == "true"
                  manage_alerts = os.environ["ALERTS_ENABLED"] == "true"
                  desired_target_ids = {target["id"] for _, target in configured_targets}

                  targets_response = request("GET", "/api/v1/targets")
                  targets_by_id = {}
                  target_ids_by_name = {}
                  for item in targets_response:
                      target = item["target"]
                      name = target["name"]
                      target_ids_by_name.setdefault(name, set()).add(target["id"])
                      targets_by_id[target["id"]] = target

                  target_changes = []
                  replacement_ids = set()
                  for title, target in configured_targets:
                      name, target_id = target["name"], target["id"]
                      previous_ids = target_ids_by_name.get(name, set()) - {target_id}
                      if previous_ids & desired_target_ids:
                          raise ValueError(f'target name {name!r} is used by another configured target')
                      replacement_ids.update(previous_ids)
                      if target_id in targets_by_id and targets_by_id[target_id]["name"] != name:
                          existing_name = targets_by_id[target_id]["name"]
                          raise ValueError(
                              f'target ID {target_id} already has title {existing_name!r}; '
                              f'changing it to {name!r} is not supported. '
                              'Keep the existing title or create a target with a new ID'
                          )
                      target_changes.append((name, target_id in targets_by_id, target))
                      target_ids_by_name.setdefault(name, set()).add(target_id)
                      targets_by_id[target_id] = target

                  alerts_by_id = {}
                  alerts_by_title = {}
                  all_existing_alerts = existing_alerts() if manage_alerts or replacement_ids else []
                  for alert in all_existing_alerts:
                      alerts_by_id[alert["id"]] = alert
                      alerts_by_title.setdefault(alert["title"], []).append(alert)

                  changes = []
                  seen_resolved_ids = set()
                  for source, alert in configured_alerts:
                      title = alert["title"]
                      requested_id = alert.get("id")
                      title_matches = alerts_by_title.get(title, [])
                      if len(title_matches) > 1:
                          raise ValueError(f'alert title {title!r} is not unique; give existing alerts unique titles')
                      if requested_id is not None:
                          existing = alerts_by_id.get(requested_id)
                      else:
                          existing = title_matches[0] if title_matches else None
                      alert_id = existing["id"] if existing else requested_id
                      if title_matches and (not existing or title_matches[0]["id"] != alert_id):
                          raise ValueError(f'alert title {title!r} already belongs to another alert')
                      if alert_id is not None:
                          if alert_id in seen_resolved_ids:
                              raise ValueError(f'alert id {alert_id!r} is selected by more than one configured alert')
                          seen_resolved_ids.add(alert_id)
                      missing = [id for id in alert["targets"] if id not in targets_by_id]
                      if missing:
                          raise ValueError(f'alert {title!r}: target ID(s) not found: {", ".join(missing)}')
                      if manage_targets:
                          unmanaged = [id for id in alert["targets"] if id not in desired_target_ids]
                          if unmanaged:
                              raise ValueError(
                                  f'alert {title!r}: target ID(s) are absent from parseable.targets: {", ".join(unmanaged)}'
                              )
                      payload = dict(alert)
                      for field in ("version", "state", "notificationState", "created", "lastTriggeredAt"):
                          payload.pop(field, None)
                      if alert_id is not None:
                          payload["id"] = alert_id
                      changes.append((title, existing is not None, alert_id, payload))

                  if replacement_ids:
                      blocked_targets = {}
                      for alert in all_existing_alerts:
                          current = request("GET", f'/api/v1/alerts/{alert["id"]}')
                          for old_id in set(current["targets"]) & replacement_ids:
                              target_name = targets_by_id[old_id]["name"]
                              blocked_targets.setdefault(target_name, set()).add(current["title"])
                      if blocked_targets:
                          target_name, alert_titles = sorted(blocked_targets.items())[0]
                          names = ", ".join(repr(title) for title in sorted(alert_titles))
                          raise ValueError(
                              f'target {target_name!r} is used by alert(s): {names}; '
                              'remove those alerts or switch them to another target before changing its ID'
                          )

                  for target_id in replacement_ids:
                      request("DELETE", f'/api/v1/targets/{target_id}')
                      print(f'Deleted old target ID: {target_id}', file=sys.stderr, flush=True)

                  for name, exists, target in target_changes:
                      if exists:
                          response = request("PUT", f'/api/v1/targets/{target["id"]}', target)
                      else:
                          response = request("POST", "/api/v1/targets", target)
                      if not isinstance(response, dict) or response.get("id") != target["id"] or response.get("name") != name:
                          raise ValueError(
                              f'target {name!r}: server did not return the requested id and title; '
                              'deploy the Parseable image with stable target ID support'
                          )
                      print(f'{"Updated" if exists else "Created"} target: {name}', file=sys.stderr, flush=True)

                  for title, exists, alert_id, payload in changes:
                      if exists:
                          response = request("PUT", f'/api/v1/alerts/{alert_id}', payload)
                          action = "Updated"
                      else:
                          response = request("POST", "/api/v1/alerts", payload)
                          action = "Created"
                      response_id = response.get("id") if isinstance(response, dict) else None
                      if (not isinstance(response_id, str) or not ulid_pattern.fullmatch(response_id)
                          or (alert_id is not None and response_id != alert_id) or response.get("title") != title):
                          raise ValueError(
                              f'alert {title!r}: server did not return the expected id and title'
                          )
                      print(f'{action} alert: {title}', file=sys.stderr, flush=True)

                  if manage_alerts:
                      for alert_id, alert in alerts_by_id.items():
                          if alert_id not in seen_resolved_ids:
                              request("DELETE", f'/api/v1/alerts/{alert_id}')
                              print(f'Deleted alert: {alert["title"]}', file=sys.stderr, flush=True)

                  if manage_targets:
                      for item in targets_response:
                          target = item["target"]
                          if target["id"] not in desired_target_ids and target["id"] not in replacement_ids:
                              request("DELETE", f'/api/v1/targets/{target["id"]}')
                              print(f'Deleted target: {target["name"]}', file=sys.stderr, flush=True)
              except Exception as error:
                  print(f"ERROR: {error}", file=sys.stderr, flush=True)
                  sys.exit(1)
          env:
            - name: CONFIGURED_TARGETS
              value: {{ toJson $targets | quote }}
            - name: MANAGE_TARGETS
              value: {{ ternary "true" "false" $manageTargets | quote }}
            - name: ALERTS_ENABLED
              value: {{ ternary "true" "false" $manageAlerts | quote }}
            {{- if $manageAlerts }}
            - name: ALERT_ITEMS
              value: {{ toJson $alertItems | quote }}
            {{- end }}
            {{- range $index, $item := $targets }}
            - name: TARGET_ENDPOINT_{{ $index }}
              valueFrom:
                secretKeyRef:
                  name: {{ $item.endpointSecretRef.name | quote }}
                  key: {{ $item.endpointSecretRef.key | quote }}
                  optional: true
            {{- if and (eq $item.type "alertManager") $item.usernameSecretRef }}
            - name: TARGET_USERNAME_{{ $index }}
              valueFrom:
                secretKeyRef:
                  name: {{ $item.usernameSecretRef.name | quote }}
                  key: {{ $item.usernameSecretRef.key | quote }}
                  optional: true
            - name: TARGET_PASSWORD_{{ $index }}
              valueFrom:
                secretKeyRef:
                  name: {{ $item.passwordSecretRef.name | quote }}
                  key: {{ $item.passwordSecretRef.key | quote }}
                  optional: true
            {{- end }}
            {{- end }}
            - name: PARSEABLE_BASE_URL
              value: {{ printf "http://%s.%s" $target .Release.Namespace | quote }}
            - name: P_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ $p.store.secretName }}
                  key: username
            - name: P_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $p.store.secretName }}
                  key: password
{{- end }}
