{{- $p := .Values.parseable }}
{{- if and $p.dashboards $p.dashboards.enabled }}
{{- $fullname := include "parseable.fullname" . }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $fullname }}-dashboards
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "parseable.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $fullname }}-dashboards
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "parseable.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $fullname }}-dashboards
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "parseable.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ $fullname }}-dashboards
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ $fullname }}-dashboards
  apiGroup: rbac.authorization.k8s.io
{{- end }}
