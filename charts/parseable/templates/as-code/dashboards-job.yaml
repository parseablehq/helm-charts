{{- $p := .Values.parseable }}
{{- include "parseable.validateAsCodeSection" (dict "values" $p "section" "dashboards") }}
{{- if and (hasKey $p "dashboards") (kindIs "map" $p.dashboards) $p.dashboards.enabled }}
{{- if not (hasKey $p.dashboards "items") }}{{- fail "parseable.dashboards.items is required when enabled is true." }}{{- end }}
{{- $dashboards := $p.dashboards.items }}
{{- $fullname := include "parseable.fullname" . }}
{{- $target := printf "%s-querier-service" $fullname }}
{{- if eq $p.deploymentMode "standalone" }}
  {{- $target = printf "%s-standalone-service" $fullname }}
{{- else if $p.enterprise.enabled }}
  {{- $target = printf "%s-prism-service" $fullname }}
{{- end }}
{{- $seen := dict }}
{{- $inlineNames := dict }}
{{- $externalNames := dict }}
{{- $items := list }}
{{- $byNamespace := dict }}
{{- range $index, $item := $dashboards }}
  {{- range $field := keys $item }}
    {{- if not (has $field (list "name" "json" "configMap" "namespace")) }}
      {{- fail (printf "Unknown dashboards[%d] field %q. Use name with either json or configMap; namespace is optional for configMap." $index $field) }}
    {{- end }}
  {{- end }}
  {{- $name := trim (default "" $item.name) }}
  {{- if not $name }}{{- fail (printf "dashboards[%d].name is required and cannot be blank." $index) }}{{- end }}
  {{- if hasKey $seen $name }}{{- fail (printf "Duplicate dashboard name %q in dashboards. Each dashboard needs a unique name." $name) }}{{- end }}
  {{- $_ := set $seen $name true }}
  {{- if eq (hasKey $item "json") (hasKey $item "configMap") }}
    {{- fail (printf "dashboard %q: set exactly one of json or configMap." $name) }}
  {{- end }}
  {{- if hasKey $item "json" }}
    {{- if hasKey $item "namespace" }}{{- fail (printf "dashboard %q: namespace is only valid with configMap." $name) }}{{- end }}
    {{- if not (trim $item.json) }}{{- fail (printf "dashboard %q: json cannot be empty." $name) }}{{- end }}
    {{- if gt (len $item.json) 900000 }}{{- fail (printf "dashboard %q: inline JSON exceeds 900 KB. Use a separate ConfigMap for this dashboard." $name) }}{{- end }}
    {{- $cm := include "parseable.inlineDashboardConfigMapName" (dict "root" $ "name" $item.name "index" $index) }}
    {{- $_ := set $inlineNames (printf "%s/%s" $.Release.Namespace $cm) true }}
    {{- $items = append $items (dict "name" $name "configMap" $cm "namespace" $.Release.Namespace) }}
    {{- $_ := set $byNamespace $.Release.Namespace (append (default (list) (index $byNamespace $.Release.Namespace)) $cm) }}
  {{- else }}
    {{- $cm := trim (default "" $item.configMap) }}
    {{- $ns := trim (default "" $item.namespace) }}
    {{- if not $ns }}{{- fail (printf "dashboard %q: namespace is required with configMap." $name) }}{{- end }}
    {{- if or (gt (len $cm) 253) (not (regexMatch "^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$" $cm)) }}{{- fail (printf "dashboard %q: configMap must be a valid Kubernetes ConfigMap name." $name) }}{{- end }}
    {{- range $part := splitList "." $cm }}
      {{- if gt (len $part) 63 }}{{- fail (printf "dashboard %q: each part of configMap name must be at most 63 characters." $name) }}{{- end }}
    {{- end }}
    {{- if or (not (regexMatch "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$" $ns)) (gt (len $ns) 63) }}{{- fail (printf "dashboard %q: namespace must be a valid Kubernetes namespace name." $name) }}{{- end }}
    {{- $_ := set $externalNames (printf "%s/%s" $ns $cm) true }}
    {{- $items = append $items (dict "name" $name "configMap" $cm "namespace" $ns) }}
    {{- $_ := set $byNamespace $ns (append (default (list) (index $byNamespace $ns)) $cm) }}
  {{- end }}
{{- end }}
{{- range $name := keys $externalNames }}
  {{- if hasKey $inlineNames $name }}{{- fail (printf "ConfigMap %s is generated for an inline dashboard; choose a different external ConfigMap name." $name) }}{{- end }}
{{- end }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "%s-dashboards" (trunc 52 $fullname | trimSuffix "-") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "parseable.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "10"
    "helm.sh/hook-output-log-policy": hook-failed
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded,hook-failed
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 420
  template:
    metadata:
      labels:
        {{- include "parseable.labels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ $fullname }}-dashboard-reader
      securityContext:
        {{- toYaml $p.podSecurityContext | nindent 8 }}
      containers:
        - name: import-dashboards
          image: docker.io/library/python:3.12-alpine
          imagePullPolicy: IfNotPresent
          command: ["python", "-c"]
          args:
            - |-
              """Reconcile Parseable dashboards from configured ConfigMaps."""

              import base64
              import json
              import os
              import secrets
              import sys
              import time
              from urllib.error import HTTPError, URLError
              from urllib.parse import quote
              from urllib.request import Request, urlopen


              BASE = os.environ["PARSEABLE_BASE_URL"].rstrip("/")
              AUTH = base64.b64encode(
                  f'{os.environ["P_USERNAME"]}:{os.environ["P_PASSWORD"]}'.encode()
              ).decode()
              API_PATH = "/api/v1/dashboards"
              ALPHABET = "0123456789ABCDEFGHJKMNPQRSTVWXYZ"
              TOKEN_PATH = "/var/run/secrets/kubernetes.io/serviceaccount/token"
              CA_PATH = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"


              def new_ulid():
                  value = ((time.time_ns() // 1_000_000) & ((1 << 48) - 1)) << 80
                  value |= secrets.randbits(80)
                  chars = []
                  for _ in range(26):
                      chars.append(ALPHABET[value & 31])
                      value >>= 5
                  return "".join(reversed(chars))


              def api_request(method, endpoint, payload=None):
                  body = None if payload is None else json.dumps(payload).encode()
                  headers = {"Authorization": f"Basic {AUTH}"}
                  if body is not None:
                      headers["Content-Type"] = "application/json"
                  req = Request(BASE + endpoint, data=body, headers=headers, method=method)
                  try:
                      with urlopen(req, timeout=30) as response:
                          content = response.read()
                  except HTTPError as error:
                      if method == "PUT" and endpoint.startswith(API_PATH + "/") and error.code == 400:
                          detail = error.read(512).decode(errors="replace")
                          if "Dashboard does not exist or you do not have permission to access it" in detail:
                              title = payload.get("title") if isinstance(payload, dict) else endpoint
                              raise ValueError(
                                  f"dashboard {title!r} cannot be updated by this account; "
                                  "it may belong to another user. Update it as its owner or "
                                  "remove it before running Helm again"
                              ) from error
                      raise ValueError(f"Parseable {method} {endpoint} returned HTTP {error.code}") from error
                  return json.loads(content) if method == "GET" and content else None


              def read_json(content, source):
                  try:
                      value = json.loads(content)
                  except (UnicodeError, json.JSONDecodeError) as error:
                      raise ValueError(f"{source} contains invalid JSON: {error}") from error
                  if not isinstance(value, dict):
                      raise ValueError(f"{source} must contain a JSON object")
                  return value


              def read_configmap(namespace, name, token, context):
                  url = (
                      "https://kubernetes.default.svc/api/v1/namespaces/"
                      f"{quote(namespace, safe='')}/configmaps/{quote(name, safe='')}"
                  )
                  request = Request(url, headers={"Authorization": f"Bearer {token}"})
                  try:
                      with urlopen(request, timeout=15, context=context) as response:
                          configmap = json.load(response)
                  except json.JSONDecodeError as error:
                      raise ValueError(f"Kubernetes returned invalid ConfigMap data for {namespace}/{name}") from error
                  except HTTPError as error:
                      if error.code == 404:
                          raise ValueError(f"ConfigMap {namespace}/{name} was not found; create it before running Helm") from error
                      if error.code == 403:
                          raise ValueError(f"cannot read ConfigMap {namespace}/{name}; grant the dashboard Job get permission in that namespace") from error
                      raise ValueError(f"reading ConfigMap {namespace}/{name} returned HTTP {error.code}") from error
                  except (URLError, TimeoutError) as error:
                      raise ValueError(f"cannot reach Kubernetes API while reading ConfigMap {namespace}/{name}") from error
                  if not isinstance(configmap, dict):
                      raise ValueError(f"Kubernetes returned invalid ConfigMap {namespace}/{name}")
                  data = configmap.get("data") or {}
                  if not isinstance(data, dict) or len(data) != 1 or configmap.get("binaryData"):
                      raise ValueError(f"ConfigMap {namespace}/{name} must have exactly one text entry in data and no binaryData")
                  key, content = next(iter(data.items()))
                  if not isinstance(content, str) or not content.strip():
                      raise ValueError(f"ConfigMap {namespace}/{name} key {key!r} is empty")
                  return content


              def discover_configmaps():
                  import ssl

                  items = json.loads(os.environ["DASHBOARD_ITEMS"])
                  if not isinstance(items, list):
                      raise ValueError("dashboards must be a list")
                  if not items:
                      return {}
                  seen = set()
                  for item in items:
                      name = item["name"]
                      if name in seen:
                          raise ValueError(f"duplicate dashboard name {name!r} in dashboards")
                      seen.add(name)
                  with open(TOKEN_PATH, encoding="utf-8") as stream:
                      token = stream.read().strip()
                  context = ssl.create_default_context(cafile=CA_PATH)
                  configured = {}
                  for item in items:
                      name, namespace, cm = item["name"], item["namespace"], item["configMap"]
                      content = read_configmap(namespace, cm, token, context)
                      configured[name] = read_json(content, f"dashboard {name!r} from ConfigMap {namespace}/{cm}")
                  return configured


              def dashboard_payload(title, imported):
                  if "tiles" not in imported:
                      raise ValueError(f"dashboard {title!r}: tiles field is required in the exported JSON")
                  tiles = imported["tiles"]
                  if not isinstance(tiles, list) or any(not isinstance(tile, dict) for tile in tiles):
                      raise ValueError(f"dashboard {title!r}: tiles must be a list of objects")
                  dashboard = {
                      "title": title,
                      "tiles": [dict(tile) for tile in tiles],
                      "tags": imported.get("tags") or [],
                      "sections": imported.get("sections") or [],
                      "variables": imported.get("variables") or [],
                      "isFavorite": imported.get("isFavorite", False),
                  }
                  if "timeRange" in imported:
                      dashboard["timeRange"] = imported["timeRange"]
                  for field in ("tags", "sections", "variables"):
                      if not isinstance(dashboard[field], list):
                          raise ValueError(f"dashboard {title!r}: {field} must be a list")
                  return dashboard


              def comparable(dashboard):
                  fields = ("title", "tiles", "tags", "sections", "variables", "isFavorite", "timeRange")
                  result = {field: dashboard.get(field) for field in fields}
                  result["tiles"] = [
                      {key: value for key, value in tile.items() if key != "tile_id"}
                      for tile in dashboard.get("tiles") or []
                  ]
                  for field in ("tags", "sections", "variables"):
                      result[field] = result[field] or []
                  return result


              def prepare_tiles(desired, current=None):
                  existing_tiles = (current or {}).get("tiles") or []
                  for index, tile in enumerate(desired["tiles"]):
                      if index < len(existing_tiles) and existing_tiles[index].get("tile_id"):
                          tile["tile_id"] = existing_tiles[index]["tile_id"]
                      else:
                          tile["tile_id"] = new_ulid()


              def reconcile(configured):
                  desired = {title: dashboard_payload(title, data) for title, data in configured.items()}
                  items = api_request("GET", API_PATH)
                  if not isinstance(items, list):
                      raise ValueError("Parseable returned an invalid dashboard list; no changes made")
                  existing = {}
                  for item in items:
                      if not isinstance(item, dict) or not item.get("title") or not item.get("dashboardId"):
                          raise ValueError("Parseable returned an incomplete dashboard list; no changes made")
                      title = item["title"]
                      if title in existing:
                          raise ValueError(f"Parseable has duplicate dashboard title {title!r}; no changes made")
                      existing[title] = item["dashboardId"]

                  for title, payload in desired.items():
                      dashboard_id = existing.get(title)
                      if dashboard_id:
                          current = api_request("GET", f"{API_PATH}/{dashboard_id}")
                          if not isinstance(current, dict):
                              raise ValueError(f"Parseable returned invalid dashboard {title!r}")
                          if comparable(current) == comparable(payload):
                              print(f"Unchanged dashboard: {title}", flush=True)
                              continue
                          prepare_tiles(payload, current)
                          api_request("PUT", f"{API_PATH}/{dashboard_id}", payload)
                          print(f"Updated dashboard: {title}", flush=True)
                      else:
                          prepare_tiles(payload)
                          api_request("POST", API_PATH, payload)
                          print(f"Created dashboard: {title}", flush=True)

                  for title, dashboard_id in existing.items():
                      if title not in desired:
                          api_request("DELETE", f"{API_PATH}/{dashboard_id}")
                          print(f"Deleted dashboard: {title}", flush=True)


              def wait_for_api():
                  deadline = time.monotonic() + 120
                  url = BASE + "/api/v1/readiness"
                  while True:
                      try:
                          with urlopen(url, timeout=5):
                              return
                      except (HTTPError, URLError, TimeoutError):
                          if time.monotonic() >= deadline:
                              raise ValueError("Parseable API did not become ready within 120 seconds")
                          time.sleep(5)


              def main():
                  configured = discover_configmaps()
                  wait_for_api()
                  reconcile(configured)


              if __name__ == "__main__":
                  try:
                      main()
                  except Exception as error:
                      print(f"ERROR: {error}", file=sys.stderr, flush=True)
                      sys.exit(1)
          env:
            - name: DASHBOARD_ITEMS
              value: {{ toJson $items | quote }}
            - name: PARSEABLE_BASE_URL
              value: {{ printf "http://%s.%s" $target .Release.Namespace | quote }}
            - name: P_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ $p.store.secretName }}
                  key: username
            - name: P_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $p.store.secretName }}
                  key: password
{{- end }}
