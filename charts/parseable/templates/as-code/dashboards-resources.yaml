{{- $p := .Values.parseable }}
{{- include "parseable.validateAsCodeSection" (dict "values" $p "section" "dashboards") }}
{{- if and (hasKey $p "dashboards") (kindIs "map" $p.dashboards) $p.dashboards.enabled }}
{{- $fullname := include "parseable.fullname" . }}
{{- $readerRoleName := printf "%s-%s-dashboard-reader" $fullname .Release.Namespace }}
{{- $byNamespace := dict }}
{{- range $index, $item := $p.dashboards.items }}
  {{- if hasKey $item "json" }}
    {{- $cm := include "parseable.inlineDashboardConfigMapName" (dict "root" $ "name" $item.name "index" $index) }}
    {{- include "parseable.validateInlineDashboardJson" (dict "name" $item.name "json" $item.json) }}
    {{- $_ := set $byNamespace $.Release.Namespace (append (default (list) (index $byNamespace $.Release.Namespace)) $cm) }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $cm }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "parseable.labels" $ | nindent 4 }}
data:
  dashboard.json: |-
    {{- $item.json | nindent 4 }}
  {{- else if hasKey $item "configMap" }}
    {{- if not (trim (default "" $item.namespace)) }}{{- fail (printf "dashboard %q: namespace is required with configMap." (default "" $item.name)) }}{{- end }}
    {{- $ns := trim $item.namespace }}
    {{- $_ := set $byNamespace $ns (append (default (list) (index $byNamespace $ns)) (trim $item.configMap)) }}
  {{- end }}
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $fullname }}-dashboard-reader
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "parseable.labels" . | nindent 4 }}
{{- range $namespace, $names := $byNamespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $readerRoleName }}
  namespace: {{ $namespace }}
  labels:
    {{- include "parseable.labels" $ | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: {{ uniq $names | toJson }}
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $readerRoleName }}
  namespace: {{ $namespace }}
  labels:
    {{- include "parseable.labels" $ | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ $fullname }}-dashboard-reader
    namespace: {{ $.Release.Namespace }}
roleRef:
  kind: Role
  name: {{ $readerRoleName }}
  apiGroup: rbac.authorization.k8s.io
{{- end }}
{{- end }}
