{{- $p := .Values.parseable }}
{{- if hasKey $p "apikeys" }}
  {{- fail "parseable.apikeys is not supported; use parseable.apiKeys (capital K)" }}
{{- end }}
{{- if hasKey $p "apiKeys" }}
{{- $seen := dict }}
{{- $seenValues := dict }}
{{- $showGeneratedCredentials := false }}
{{- range $key := $p.apiKeys }}
  {{- if not (hasKey $key "apiKeyType") }}
    {{- fail (printf "apiKeys name=%s: apiKeyType is required; set it to ingestor or query" $key.name) }}
  {{- end }}
  {{- if not (has $key.apiKeyType (list "ingestor" "query")) }}
    {{- fail (printf "apiKeys name=%s: apiKeyType must be ingestor or query" $key.name) }}
  {{- end }}
  {{- if not (regexMatch "^[A-Za-z0-9_-]+$" $key.name) }}
    {{- fail (printf "API key name %q is invalid: use only letters, digits, '-' or '_' without spaces (e.g. payment-key)" $key.name) }}
  {{- end }}
  {{- if hasKey $seen $key.name }}
    {{- fail (printf "apiKeys: duplicate name %q" $key.name) }}
  {{- end }}
  {{- $_ := set $seen $key.name true }}
  {{- if hasKey $key "secretKeyRef" }}
  {{- $secret := lookup "v1" "Secret" $.Release.Namespace $key.secretKeyRef.name }}
  {{- if not $secret }}
    {{- fail (printf "apiKeys name=%s: Secret %s not found in namespace %s; create it before Helm upgrade (offline rendering cannot use lookup)" $key.name $key.secretKeyRef.name $.Release.Namespace) }}
  {{- end }}
  {{- $data := default (dict) (get $secret "data") }}
  {{- $encoded := get $data $key.secretKeyRef.key }}
  {{- if not $encoded }}
    {{- fail (printf "apiKeys name=%s: Secret %s has no %s field or it is empty" $key.name $key.secretKeyRef.name $key.secretKeyRef.key) }}
  {{- end }}
  {{- $value := b64dec $encoded }}
  {{- if or (ne (len $value) 36) (not (regexMatch "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$" $value)) }}
    {{- fail (printf "apiKeys name=%s: Secret %s field %s must contain an RFC 4122 UUID v4 in 8-4-4-4-12 format (no spaces or newline)" $key.name $key.secretKeyRef.name $key.secretKeyRef.key) }}
  {{- end }}
  {{- if hasKey $seenValues $value }}
    {{- fail (printf "apiKeys name=%s: Secret value duplicates API key %s" $key.name (get $seenValues $value)) }}
  {{- end }}
  {{- $_ := set $seenValues $value $key.name }}
  {{- else }}
  {{- $showGeneratedCredentials = true }}
  {{- end }}
{{- end }}
{{- $fullname := include "parseable.fullname" . }}
{{- $target := printf "%s-querier-service" $fullname }}
{{- if eq $p.deploymentMode "standalone" }}
  {{- $target = printf "%s-standalone-service" $fullname }}
{{- else if $p.enterprise.enabled }}
  {{- $target = printf "%s-prism-service" $fullname }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fullname }}-api-keys-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "parseable.labels" . | nindent 4 }}
data:
  api-keys.json: |-
    {{ toJson $p.apiKeys }}
  reconcile-api-keys.py: |-
    import base64
    import json
    import os
    import re
    import signal
    import sys
    from uuid import uuid4
    from urllib.error import HTTPError, URLError
    from urllib.parse import quote
    from urllib.request import Request, urlopen

    BASE = os.environ["PARSEABLE_BASE_URL"].rstrip("/")
    AUTH = base64.b64encode(
        f'{os.environ["P_USERNAME"]}:{os.environ["P_PASSWORD"]}'.encode()
    ).decode()
    PATH = "/api/prism/v1/apikeys"
    API_KEY_ROLES = {"ingestor": "__global_ingestor__", "query": "__global_querier__"}
    UUID_V4 = re.compile(r"[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}")

    class ReconcileError(Exception):
        pass

    changes = {"created": 0, "updated": 0, "deleted": 0}
    generated_credentials = []
    temporary_rotations = set()

    def show_generated_credentials():
        if generated_credentials:
            print("New API keys (save now): " + " | ".join(generated_credentials), flush=True)
            generated_credentials.clear()

    def handle_termination(signum, _frame):
        show_generated_credentials()
        raise SystemExit(128 + signum)

    signal.signal(signal.SIGTERM, handle_termination)

    def report_error(error):
        parts = [f"ERROR: {error}"]
        if any(changes.values()):
            parts.append("API keys: " + ", ".join(
                f"{kind}={changes[kind]}" for kind in ("created", "updated", "deleted") if changes[kind]
            ))
        if temporary_rotations:
            parts.append("temporary rotation remains for " + ", ".join(sorted(temporary_rotations)) + "; rerun Helm to finish")
        print(" | ".join(parts), file=sys.stderr, flush=True)

    def request(method, path, payload=None, expect_json=True):
        body = None if payload is None else json.dumps(payload).encode()
        headers = {"Authorization": f"Basic {AUTH}"}
        if body is not None:
            headers["Content-Type"] = "application/json"
        req = Request(BASE + path, data=body, headers=headers, method=method)
        try:
            with urlopen(req, timeout=20) as response:
                content = response.read()
                if not expect_json:
                    return None
                try:
                    return json.loads(content) if content else None
                except json.JSONDecodeError as error:
                    raise ReconcileError(f"{method} {path}: invalid JSON response") from error
        except HTTPError as error:
            # Never print response bodies: a proxy could echo a credential.
            raise ReconcileError(f"{method} {path}: HTTP {error.code}") from error
        except URLError as error:
            raise ReconcileError(f"{method} {path}: {error.reason}") from error
        except TimeoutError as error:
            raise ReconcileError(f"{method} {path}: timed out") from error

    def load_desired():
        with open("/scripts/api-keys.json", encoding="utf-8") as file:
            configured = json.load(file)
        desired = []
        names = set()
        values = set()
        errors = []
        for index, item in enumerate(configured):
            name = item["name"]
            key_type = item["apiKeyType"]
            secret_ref = item.get("secretKeyRef")
            value = os.environ.get(f"API_KEY_{index}") if secret_ref is not None else None
            if key_type not in API_KEY_ROLES:
                errors.append(f"name={name}: apiKeyType must be ingestor or query")
            if name in names:
                errors.append(f"name={name}: duplicate API key name")
            names.add(name)
            if secret_ref is not None and not value:
                errors.append(
                    f"name={name}: Secret {secret_ref['name']} "
                    f"is missing key {secret_ref['key']} or its value is empty"
                )
            elif value is not None and not UUID_V4.fullmatch(value):
                errors.append(
                    f"name={name}: apiKey must be an RFC 4122 UUID v4 in 8-4-4-4-12 format "
                    "(no spaces or newline)"
                )
            elif value is not None and value in values:
                errors.append(f"name={name}: API key value is duplicated in apiKeys")
            elif value is not None:
                values.add(value)
            desired.append((name, value, key_type))
        if errors:
            raise ReconcileError("; ".join(errors))
        return desired

    def main():
        # Validate provided Secret values before making a create API call.
        desired = load_desired()
        if not desired:
            listed = request("GET", PATH)
            if not isinstance(listed, list) or any(
                not isinstance(item, dict)
                or not isinstance(item.get("keyName"), str)
                or not isinstance(item.get("keyId"), str)
                for item in listed
            ):
                raise ReconcileError("GET /api/prism/v1/apikeys returned an unexpected response")
            if len({item["keyId"] for item in listed}) != len(listed):
                raise ReconcileError("API key list contains duplicate IDs")
            failures = []
            for item in listed:
                name, key_id = item["keyName"], item["keyId"]
                try:
                    request("DELETE", f"{PATH}/{quote(key_id, safe='')}", expect_json=False)
                    changes["deleted"] += 1
                except ReconcileError as error:
                    failures.append(f"name={name}: {error}")
            if failures:
                raise ReconcileError("; ".join(failures))
            return

        listed = request("GET", PATH)
        if not isinstance(listed, list):
            raise ReconcileError("GET /api/prism/v1/apikeys returned an unexpected response")
        existing = {}
        seen_ids = set()
        for item in listed:
            if not isinstance(item, dict) or not isinstance(item.get("keyName"), str) or not isinstance(item.get("keyId"), str):
                raise ReconcileError("API key list contains an unexpected entry")
            if item["keyName"] in existing:
                raise ReconcileError(f"duplicate existing API key name: {item['keyName']}")
            if item["keyId"] in seen_ids:
                raise ReconcileError(f"duplicate existing API key ID: {item['keyId']}")
            seen_ids.add(item["keyId"])
            existing[item["keyName"]] = item["keyId"]

        # Read each current value once, then plan changes independently of YAML order.
        details = {}
        owners = {}
        for existing_name, key_id in existing.items():
            detail = request("GET", f"{PATH}/{quote(key_id, safe='')}")
            if not isinstance(detail, dict) or not isinstance(detail.get("apiKey"), str) or not isinstance(detail.get("roles"), list):
                raise ReconcileError(f"name={existing_name}: API key detail has an unexpected response")
            if detail["apiKey"] in owners:
                raise ReconcileError("existing API keys contain a duplicate value")
            details[existing_name] = detail
            owners[detail["apiKey"]] = existing_name

        wanted_names = {name for name, _, _ in desired}
        pending_updates = []
        pending = []
        for name, value, key_type in desired:
            if name in existing:
                detail = details[name]
                if set(detail["roles"]) != {API_KEY_ROLES[key_type]}:
                    current_type = next(
                        (kind for kind, role in API_KEY_ROLES.items() if set(detail["roles"]) == {role}),
                        None,
                    )
                    raise ReconcileError(
                        f"name={name}: cannot change apiKeyType from {current_type or 'custom roles'} "
                        f"to {key_type}; revoke and recreate the key explicitly"
                    )
                if value is not None and detail["apiKey"] != value:
                    pending_updates.append((name, existing[name], value, key_type, None, {"apiKey": value}))
            elif value is not None and (owner := owners.get(value)) and owner not in wanted_names:
                # A value retained under a new name identifies a rename.
                detail = details[owner]
                if set(detail["roles"]) != {API_KEY_ROLES[key_type]}:
                    current_type = next(
                        (kind for kind, role in API_KEY_ROLES.items() if set(detail["roles"]) == {role}),
                        "custom roles",
                    )
                    raise ReconcileError(
                        f"name={name}: cannot change apiKeyType from {current_type} to {key_type} "
                        f"while renaming {owner}; revoke and recreate the key explicitly"
                    )
                pending_updates.append((name, existing[owner], value, key_type, owner, {"keyName": name}))
            else:
                pending.append((name, value, key_type))

        rotations = {update[0] for update in pending_updates if "apiKey" in update[5]}
        early_deletions = set()
        for name, _, value, _, old_name, _ in pending_updates:
            owner = owners.get(value)
            if owner is not None and owner != (old_name or name) and owner not in rotations:
                if owner in wanted_names:
                    raise ReconcileError(f"name={name}: new key value already belongs to API key {owner}")
                early_deletions.add(owner)
        for name, value, _ in pending:
            owner = owners.get(value) if value is not None else None
            if owner is not None and owner not in rotations:
                raise ReconcileError(f"name={name}: this key value already belongs to API key {owner}")

        # A key's old value becomes available only after its PATCH succeeds.
        ordered_updates = []
        remaining = pending_updates[:]
        completed_rotations = set()
        reserved_values = set(owners) | {value for _, value, _ in desired if value is not None}
        temporary_values = set()
        while remaining:
            ready = [update for update in remaining if (
                "apiKey" not in update[5]
                or owners.get(update[2]) in (None, update[4] or update[0])
                or owners.get(update[2]) in completed_rotations
                or owners.get(update[2]) in early_deletions
            )]
            if not ready:
                # Follow owners to find a cycle, then free one value with a
                # temporary UUID. This needs one extra PATCH per cycle.
                rotating = {update[0]: update for update in remaining}
                cursor = next(iter(rotating))
                visited = set()
                while cursor not in visited:
                    visited.add(cursor)
                    cursor = owners[rotating[cursor][2]]
                pivot = rotating[cursor]
                temporary = str(uuid4())
                while temporary in reserved_values:
                    temporary = str(uuid4())
                reserved_values.add(temporary)
                temporary_values.add(temporary)
                ordered_updates.append((pivot[0], pivot[1], temporary, pivot[3], None, {"apiKey": temporary}))
                completed_rotations.add(pivot[0])
                continue
            for update in ready:
                ordered_updates.append(update)
                remaining.remove(update)
                if "apiKey" in update[5]:
                    completed_rotations.add(update[0])

        # An omitted key may own a value needed by a retained key. Revoke it
        # before the PATCH; all other omitted keys are revoked at the end.
        for name in sorted(early_deletions):
            request("DELETE", f"{PATH}/{quote(existing[name], safe='')}", expect_json=False)
            del existing[name]
            changes["deleted"] += 1

        for name, key_id, value, key_type, old_name, payload in ordered_updates:
            updated = request("PATCH", f"{PATH}/{quote(key_id, safe='')}", payload)
            if (
                not isinstance(updated, dict)
                or updated.get("keyId") != key_id
                or updated.get("keyName") != name
                or updated.get("apiKey") != value
                or not isinstance(updated.get("roles"), list)
                or set(updated.get("roles", [])) != {API_KEY_ROLES[key_type]}
            ):
                raise ReconcileError(f"name={name}: API key did not match after update")
            changes["updated"] += 1
            if value in temporary_values:
                temporary_rotations.add(name)
            else:
                temporary_rotations.discard(name)
            if old_name is not None:
                del existing[old_name]
                existing[name] = key_id

        for name, value, key_type in pending:
            payload = {"keyName": name, "apiKeyType": key_type}
            if value is not None:
                payload["apiKey"] = value
            try:
                created = request("POST", PATH, payload)
            except ReconcileError as error:
                if "HTTP 400" in str(error):
                    raise ReconcileError(
                        f"name={name}: server rejected {key_type} API key creation (HTTP 400); "
                        "deploy the updated Parseable image"
                    ) from error
                raise
            accepted = (
                isinstance(created, dict)
                and isinstance(created.get("apiKey"), str)
                and (created["apiKey"] == value if value is not None else bool(UUID_V4.fullmatch(created["apiKey"])))
                and created.get("keyName") == name
                and isinstance(created.get("roles"), list)
                and set(created["roles"]) == {API_KEY_ROLES[key_type]}
            )
            if not accepted:
                key_id = created.get("keyId") if isinstance(created, dict) else None
                if isinstance(key_id, str):
                    try:
                        request("DELETE", f"{PATH}/{quote(key_id, safe='')}")
                    except ReconcileError as error:
                        raise ReconcileError(
                            f"name={name}: server did not honor apiKey or {key_type} role "
                            f"and rollback failed: {error}"
                        ) from error
                raise ReconcileError(
                    f"name={name}: server did not honor apiKey or {key_type} role; "
                    "deploy the updated Parseable image before creating API keys"
                )
            if value is None:
                display_name = name if re.fullmatch(r"[A-Za-z0-9._-]+", name) else json.dumps(name)
                generated_credentials.append(f"{display_name}={created['apiKey']}")
            changes["created"] += 1

        failures = []
        for name in sorted(set(existing) - wanted_names):
            try:
                request("DELETE", f"{PATH}/{quote(existing[name], safe='')}", expect_json=False)
                changes["deleted"] += 1
            except ReconcileError as error:
                failures.append(f"name={name}: {error}")
        if failures:
            raise ReconcileError("; ".join(failures))

    try:
        main()
    except ReconcileError as error:
        report_error(error)
        sys.exit(1)
    finally:
        show_generated_credentials()
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $fullname }}-api-keys
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "parseable.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "20"
    "helm.sh/hook-output-log-policy": {{ ternary "hook-failed,hook-succeeded" "hook-failed" $showGeneratedCredentials }}
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded,hook-failed
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 540
  template:
    metadata:
      labels:
        {{- include "parseable.labels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      securityContext:
        {{- toYaml $p.podSecurityContext | nindent 8 }}
      volumes:
        - name: script
          configMap:
            name: {{ $fullname }}-api-keys-config
      containers:
        - name: reconcile-api-keys
          image: docker.io/library/python:3.12-alpine
          imagePullPolicy: IfNotPresent
          command: ["python", "/scripts/reconcile-api-keys.py"]
          env:
            - name: PARSEABLE_BASE_URL
              value: {{ printf "http://%s.%s" $target .Release.Namespace | quote }}
            - name: P_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ $p.store.secretName }}
                  key: username
            - name: P_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $p.store.secretName }}
                  key: password
            {{- range $index, $key := $p.apiKeys }}
            {{- if hasKey $key "secretKeyRef" }}
            - name: API_KEY_{{ $index }}
              valueFrom:
                secretKeyRef:
                  name: {{ $key.secretKeyRef.name | quote }}
                  key: {{ $key.secretKeyRef.key | quote }}
                  optional: true
            {{- end }}
            {{- end }}
          volumeMounts:
            - name: script
              mountPath: /scripts
              readOnly: true
{{- end }}
