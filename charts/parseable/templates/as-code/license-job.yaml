{{- if and .Values.parseable.enterprise.enabled (not (empty .Values.parseable.enterprise.license.secretName)) (not (empty .Values.parseable.enterprise.license.dataKey)) (empty .Values.parseable.enterprise.license.signature.source) (empty .Values.parseable.enterprise.license.signature.key) (empty .Values.parseable.enterprise.license.signature.base64) }}
{{- $p := .Values.parseable }}
{{- $license := $p.enterprise.license }}
{{- $fullname := include "parseable.fullname" . }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $fullname }}-license
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "parseable.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-output-log-policy": hook-failed
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded,hook-failed
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 540
  template:
    metadata:
      labels:
        {{- include "parseable.labels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      securityContext:
        {{- toYaml $p.podSecurityContext | nindent 8 }}
      volumes:
        - name: license
          secret:
            secretName: {{ $license.secretName | quote }}
            optional: true
            items:
              - key: {{ $license.dataKey | quote }}
                path: license.json
      containers:
        - name: install-license
          image: {{ include "parseable.waitImage" . | quote }}
          imagePullPolicy: {{ $p.waitImage.pullPolicy }}
          command: ["/bin/sh", "-ec"]
          args:
            - |-
              if [ ! -f /license/license.json ]; then
                echo "ERROR: License file not found. Secret {{ $license.secretName }} in namespace {{ .Release.Namespace }} must contain key {{ $license.dataKey }}; check license.secretName and license.dataKey." >&2
                exit 1
              fi
              if [ ! -s /license/license.json ]; then
                echo "ERROR: License key {{ $license.dataKey }} in Secret {{ $license.secretName }} is empty." >&2
                exit 1
              fi
              deadline=$(( $(date +%s) + 120 ))
              until curl -fs --connect-timeout 2 --max-time 5 -o /dev/null "$PARSEABLE_URL/api/v1/readiness"; do
                if [ "$(date +%s)" -ge "$deadline" ]; then
                  echo "ERROR: Parseable API did not become ready within 120 seconds" >&2
                  exit 1
                fi
                sleep 5
              done
              if ! status=$(curl -sS --connect-timeout 5 --max-time 120 \
                -o /dev/null -w '%{http_code}' \
                -u "$P_USERNAME:$P_PASSWORD" \
                -H 'Content-Type: application/json' \
                -X PUT --data-binary @/license/license.json \
                "$PARSEABLE_URL/api/v1/license"); then
                echo "Failed to install the provided license" >&2
                exit 1
              fi
              if [ "$status" = "400" ]; then
                echo "ERROR: Invalid license (HTTP 400). Verify the license and retry." >&2
                exit 1
              fi
              if [ "$status" != "200" ]; then
                echo "Failed to install the provided license (HTTP $status)" >&2
                exit 1
              fi
              echo "Provided license installed"
          env:
            - name: PARSEABLE_URL
              {{- if eq $p.deploymentMode "standalone" }}
              value: {{ printf "http://%s-standalone-service.%s:%v" $fullname .Release.Namespace $p.standalone.unified.service.port | quote }}
              {{- else }}
              value: {{ printf "http://%s-prism-service.%s:%v" $fullname .Release.Namespace $p.distributed.prism.service.port | quote }}
              {{- end }}
            - name: P_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ $p.store.secretName | quote }}
                  key: username
            - name: P_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $p.store.secretName | quote }}
                  key: password
          volumeMounts:
            - name: license
              mountPath: /license
              readOnly: true
{{- end }}
