{{- if and (eq .Values.parseable.deploymentMode "distributed") .Values.parseable.enterprise.enabled (eq (include "parseable.enterpriseLicenseMode" .) "provided") }}
{{- $p := .Values.parseable }}
{{- $license := $p.enterprise.license }}
{{- $fullname := include "parseable.fullname" . }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $fullname }}-license
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "parseable.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-output-log-policy": hook-failed
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded,hook-failed
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 540
  template:
    metadata:
      labels:
        {{- include "parseable.labels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      securityContext:
        {{- toYaml $p.podSecurityContext | nindent 8 }}
      {{- include "parseable.waitForApi" . | nindent 6 }}
      volumes:
        - name: license
          secret:
            secretName: {{ $license.secretName | quote }}
            items:
              - key: {{ $license.dataKey | quote }}
                path: license.json
      containers:
        - name: install-license
          image: {{ include "parseable.waitImage" . | quote }}
          imagePullPolicy: {{ $p.waitImage.pullPolicy }}
          command: ["/bin/sh", "-ec"]
          args:
            - |-
              if ! status=$(curl -sS --connect-timeout 5 --max-time 120 \
                -o /dev/null -w '%{http_code}' \
                -u "$P_USERNAME:$P_PASSWORD" \
                -H 'Content-Type: application/json' \
                -X PUT --data-binary @/license/license.json \
                "$PARSEABLE_URL/api/v1/license"); then
                echo "Failed to install the provided license" >&2
                exit 1
              fi
              if [ "$status" != "200" ]; then
                echo "Failed to install the provided license (HTTP $status)" >&2
                exit 1
              fi
              echo "Provided license installed"
          env:
            - name: PARSEABLE_URL
              value: {{ printf "http://%s-prism-service.%s:%v" $fullname .Release.Namespace $p.distributed.prism.service.port | quote }}
            - name: P_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ $p.store.secretName | quote }}
                  key: username
            - name: P_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $p.store.secretName | quote }}
                  key: password
          volumeMounts:
            - name: license
              mountPath: /license
              readOnly: true
{{- end }}
