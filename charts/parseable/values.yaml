# yaml-language-server: $schema=./values.schema.json
## Parseable Helm chart
## Single chart for both OSS and Enterprise editions of Parseable. OSS and
## Enterprise ship as separate images (see `image` vs `enterprise.image`
## below); which one gets used is controlled by `enterprise.enabled`, not by
## the node type.
##
## Node types map 1:1 to Parseable's P_MODE values and are grouped by mode:
##   standalone.unified   -> P_MODE=all    (OSS only, single all-in-one pod)
##   distributed.ingestor -> P_MODE=ingest (OSS + Enterprise)
##   distributed.querier  -> P_MODE=query  (OSS + Enterprise)
##   distributed.prism    -> P_MODE=prism  (Enterprise only, cluster coordinator)
##
## Each node section is self-contained: its own replicas, env, resources,
## persistence, service and scheduling. There are no shared "common" blocks -
## what you see in a section is everything that applies to that node type.
##
## Docs: https://www.parseable.com/docs/installation/kubernetes-helm

parseable:
  nameOverride: ""
  fullnameOverride: ""

  ## deploymentMode: standalone | distributed
  ## standalone  - a single all-in-one pod (the `standalone.unified` section).
  ##               Simplest way to run Parseable, does not scale horizontally.
  ##               OSS or Enterprise both can be run in standalone mode.
  ## distributed - separate ingestor + querier pods (the `distributed.ingestor`
  ##               / `distributed.querier` sections), plus `distributed.prism`
  ##               when `enterprise.enabled` is true.
  deploymentMode: standalone

  ## OSS image, used by every node type unless enterprise.enabled is true
  ## see enterprise.image below, which takes precedence if enterprise.enabled is true.
  image:
    repository: quay.io/parseablehq/parseable
    tag: "" # defaults to .Chart.AppVersion
    pullPolicy: IfNotPresent

  ## Names of imagePullSecrets for pulling the image above, e.g. from a private registry.
  imagePullSecrets: []

  ## -----------------------------------------------------------------------
  ## Object store
  ## -----------------------------------------------------------------------
  store:
    ## One of: local-store, s3-store, blob-store, gcs-store.
    ## local-store keeps data on the pod's own volumes and only works with
    ## deploymentMode: standalone - it is not valid for distributed deployments.
    type: local-store

    ## Name of a pre-existing Kubernetes Secret holding the connection details
    ## for the selected store type, plus the Parseable admin credentials.
    ## The chart never creates or reads plaintext secrets from values.yaml.
    ##
    ## Create it with kubectl, using the keys expected for your store type:
    ##
    ## local-store:
    ##   kubectl create secret generic parseable-env-secret \
    ##     --from-literal=addr=0.0.0.0:8000 \
    ##     --from-literal=username=admin \
    ##     --from-literal=password=admin
    ##
    ## s3-store with static credentials (adds):
    ##     --from-literal=s3.url=<endpoint> \
    ##     --from-literal=s3.access.key=<key> \
    ##     --from-literal=s3.secret.key=<secret> \
    ##     --from-literal=s3.bucket=<bucket> \
    ##     --from-literal=s3.region=<region>
    ##
    ## AWS IRSA:
    ##   Omit s3.access.key and s3.secret.key from this Secret. Annotate the
    ##   Parseable service account with its IAM role under serviceAccount.annotations.
    ##   The remaining S3 settings (url, bucket, and region) are still required.
    ##
    ## blob-store (adds):
    ##     --from-literal=azr.access_key=<key> \
    ##     --from-literal=azr.account=<account> \
    ##     --from-literal=azr.container=<container> \
    ##     --from-literal=azr.url=<url>
    ##
    ## gcs-store (adds):
    ##     --from-literal=gcs.url=<url> \
    ##     --from-literal=gcs.bucket=<bucket> \
    ##     and a service-account key file, see `store.gcsCredentials` below.
    secretName: parseable-env-secret

    ## Only used when store.type is gcs-store. Points at a Secret containing
    ## the GCS service-account JSON key, which is mounted into every pod.
    ##   kubectl create secret generic parseable-gcs-key \
    ##     --from-file=key.json=<path-to-service-account-key.json>
    gcsCredentials:
      secretName: parseable-gcs-key
      secretKey: key.json
      mountPath: /var/secrets/google

  ## Shared secret used to authenticate intra-cluster requests between nodes.
  ## Required for Enterprise distributed deployments, optional for OSS
  ## distributed deployments, and not used in standalone mode. When enabled,
  ## P_CLUSTER_SECRET is injected into every distributed node from this secret.
  ##   kubectl create secret generic parseable-cluster-secret \
  ##     --from-literal=cluster-secret=<16-char-alphanumeric-string>
  clusterSecret:
    enabled: false
    secretName: parseable-cluster-secret
    secretKey: cluster-secret

  ## -----------------------------------------------------------------------
  ## Enterprise edition
  ## -----------------------------------------------------------------------
  ## Flip `enabled: true` to run Parseable Enterprise instead of OSS. Requires
  ## deploymentMode: distributed. Unlocks the `distributed.prism` node type,
  ## plus license validation and audit logging.
  enterprise:
    enabled: false

    ## Enterprise runs a different image than OSS. Used by every node type
    ## instead of the top-level `image` above whenever enabled is true.
    image:
      repository: quay.io/parseablehq/parseable-enterprise
      tag: "" # defaults to .Chart.AppVersion
      pullPolicy: IfNotPresent
    imagePullSecrets: []

    ## License is an optional configuration for Enterprise deployments.
    ## - If no license fields provided: use the built-in trial license (image v3.2.7+).
    ## - If secretName + dataKey are provided: install the license v3.
    ## - If secretName + dataKey + signature: mount legacy license files on every Enterprise pod; no license Job runs.
    ## Parseable releases older than v3.2.7 require the legacy signature configuration.
    license:
      secretName: ""
      mountPath: "" # optional; defaults to /tmp/license for legacy files
      dataKey: ""
      signature:
        source: "" # file | base64; omit for the combined JSON API Job
        key: "" # filename inside secretName when source is file
        ## Existing base64 signature Secret reference when source is base64.
        base64: {}
          # secretName: parseable-env-secret
          # key: license.signature.base64

    ## Ships an audit trail of API activity to another Parseable instance/stream.
    ## Applied to every node type (ingestor/querier/prism).
    auditLogging:
      enabled: false
      ## Change these fields to point to the appropriate Parseable server and credentials.
      server: "http://parseable-querier-service.parseable.svc.cluster.local"
      username: admin
      password: admin
      ## Reference to a Secret key holding the password instead of the
      ## plaintext `password` field above.
      existingSecret:
        name: ""
        key: ""

  ## -----------------------------------------------------------------------
  ## Shared identity / security (applies to every node type's pod)
  ## -----------------------------------------------------------------------
  serviceAccount:
    create: true
    name: "parseable"
    ## For AWS IRSA, for example:
    ## annotations:
    ##   eks.amazonaws.com/role-arn: arn:aws:iam::<account-id>:role/<role-name>
    annotations: {}

  securityContext:
    allowPrivilegeEscalation: false

  ## Pod-level security context. Applied to OSS pods only; Enterprise pods run
  ## as the image's default user (root), which its bundled ML feature needs.
  podSecurityContext:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    fsGroupChangePolicy: "Always"

  ## Image for the readiness-wait init containers: the ingestor waits for the
  ## querier (or for prism in Enterprise), and the Enterprise querier waits for
  ## prism. Pinned so every install pulls the same image; point `repository`
  ## at a mirror for clusters that cannot reach Docker Hub.
  waitImage:
    repository: docker.io/curlimages/curl
    tag: "8.23.0"
    pullPolicy: IfNotPresent

  ## =========================================================================
  ## Node types
  ## =========================================================================

  ## --- standalone --- (deploymentMode: standalone) ---------------
  standalone:
    ## Single StatefulSet pod running every function (ingest + query + storage).
    unified:
      env:
        RUST_LOG: warn
        P_CHECK_UPDATE: "false"
      resources:
        limits:
          cpu: 500m
          memory: 4Gi
        requests:
          cpu: 250m
          memory: 1Gi
      service:
        type: ClusterIP
        port: 80
      persistence:
        ## Data directory used only by local-store. When enabled, it is backed
        ## by a PVC; when disabled, it uses emptyDir. Object-store modes do not
        ## create or mount a data volume regardless of this value.
        data:
          enabled: true
          storageClass: ""
          accessMode: ReadWriteOnce
          size: 5Gi
          annotations: {}
        ## Staging directory. When enabled, it is backed by a PVC; when
        ## disabled, it uses emptyDir.
        staging:
          enabled: true
          storageClass: ""
          accessMode: ReadWriteOnce
          size: 5Gi
          annotations: {}
      podAnnotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "80"
        prometheus.io/path: "/api/v1/metrics"
      podLabels:
        app: parseable
        component: standalone
      ## Name of an existing Kubernetes PriorityClass for the standalone pod.
      priorityClassName: ""
      nodeSelector: {}
      tolerations: []
      affinity: {}
      topologySpreadConstraints: []
      terminationGracePeriodSeconds: 30
      readinessProbe:
        httpGet:
          path: /api/v1/readiness
          port: 8000

  ## --- distributed --- (deploymentMode: distributed) ----------------------
  distributed:
    ## ingestor (OSS + Enterprise) - receives and stages incoming events.
    ingestor:
      replicas: 3
      ## Resources and security context for the readiness-wait init container.
      initContainer:
        resources:
          requests:
            cpu: 20m
            memory: 16Mi
          limits:
            cpu: 250m
            memory: 64Mi
        ## Container security context for the readiness-wait init container.
        ## The default meets the Pod Security "restricted" profile. The curl
        ## image runs as the named user curl_user; the numeric ids (uid 100,
        ## gid 101) let the kubelet verify runAsNonRoot, also on Enterprise
        ## pods, which set no pod-level user.
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 100
          runAsGroup: 101
          capabilities:
            drop:
              - ALL
          seccompProfile:
            type: RuntimeDefault
      env:
        RUST_LOG: warn
        P_CHECK_UPDATE: "false"
        # General Kafka Configuration
        # P_KAFKA_BOOTSTRAP_SERVERS: "my-kafka.kafka.svc.cluster.local:9092" # Comma-separated list of Kafka bootstrap servers
        # P_KAFKA_PARTITION_LISTENER_CONCURRENCY: "2" # Number of parallel threads for Kafka partition listeners
        # P_KAFKA_CONSUMER_TOPICS: "test-log-stream-0,test-log-stream-1"
        # P_KAFKA_CLIENT_ID: "parseable-connect" # Client ID for Kafka connection
        # P_CONNECTOR_BAD_DATA_POLICY: "fail" # Default Policy for handling bad data
        # See https://www.parseable.com/docs for the full list of Kafka consumer/security options.
      resources:
        limits:
          cpu: 500m
          memory: 4Gi
        requests:
          cpu: 250m
          memory: 1Gi
      service:
        type: ClusterIP
        port: 80
      ## Local disk for staging incoming events before they are sent to the
      ## object store. When enabled, each ingestor gets a PVC; when disabled,
      ## each ingestor uses emptyDir.
      persistence:
        staging:
          enabled: true
          storageClass: ""
          accessMode: ReadWriteOnce
          size: 5Gi
          annotations: {}
      podAnnotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "80"
        prometheus.io/path: "/api/v1/metrics"
      podLabels:
        app: parseable
        component: ingestor
      ## Name of an existing Kubernetes PriorityClass for ingestor pods.
      priorityClassName: ""
      nodeSelector: {}
      tolerations: []
      affinity: {}
      topologySpreadConstraints: []
      terminationGracePeriodSeconds: 30
      readinessProbe:
        httpGet:
          path: /api/v1/readiness
          port: 8000
        timeoutSeconds: 5

    ## querier (OSS + Enterprise) - serves queries and the console. OSS supports
    ## a single querier; Enterprise can run multiple queriers behind prism.
    querier:
      replicas: 1
      ## Resources and security context for the Enterprise prism readiness-wait
      ## init container.
      initContainer:
        resources:
          requests:
            cpu: 20m
            memory: 16Mi
          limits:
            cpu: 250m
            memory: 64Mi
        ## Container security context for the readiness-wait init container.
        ## The default meets the Pod Security "restricted" profile. The curl
        ## image runs as the named user curl_user; the numeric ids (uid 100,
        ## gid 101) let the kubelet verify runAsNonRoot, also on Enterprise
        ## pods, which set no pod-level user.
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 100
          runAsGroup: 101
          capabilities:
            drop:
              - ALL
          seccompProfile:
            type: RuntimeDefault
      env:
        RUST_LOG: warn
        P_CHECK_UPDATE: "false"
      resources:
        limits:
          cpu: 500m
          memory: 4Gi
        requests:
          cpu: 250m
          memory: 1Gi
      service:
        type: ClusterIP
        port: 80
      ## Local disk used as the Enterprise hot-tier query cache, mounted at
      ## /parseable/hot-tier. When enabled, each Enterprise querier gets a PVC;
      ## when disabled, it uses emptyDir. Ignored for OSS deployments.
      persistence:
        hotTier:
          enabled: true
          storageClass: ""
          accessMode: ReadWriteOnce
          size: 50Gi
          annotations: {}
      podAnnotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "80"
        prometheus.io/path: "/api/v1/metrics"
      podLabels:
        app: parseable
        component: querier
      ## Name of an existing Kubernetes PriorityClass for querier pods.
      priorityClassName: ""
      nodeSelector: {}
      tolerations: []
      affinity: {}
      topologySpreadConstraints: []
      terminationGracePeriodSeconds: 30
      readinessProbe:
        httpGet:
          path: /api/v1/readiness
          port: 8000
        timeoutSeconds: 5

    ## prism (Enterprise only) - cluster coordinator, fronts the querier fleet.
    ## Deployed automatically whenever enterprise.enabled is true.
    prism:
      replicas: 1
      env:
        RUST_LOG: warn
        P_CHECK_UPDATE: "false"
      resources:
        limits:
          cpu: "1"
          memory: 2Gi
        requests:
          cpu: 500m
          memory: 1Gi
      service:
        type: ClusterIP
        port: 80
      ## Local disk for Prism's own state. Optional.
      persistence:
        enabled: false
        storageClass: ""
        accessMode: ReadWriteOnce
        size: 5Gi
        annotations: {}
      ## Separate volume for Prism's PromQL results cache, mounted at
      ## /parseable/promql-cache (matches P_PROMQL_RESULTS_CACHE_DIR, which the
      ## chart sets automatically). Falls back to an emptyDir when disabled.
      cache:
        enabled: false
        storageClass: ""
        accessMode: ReadWriteOnce
        size: 5Gi
        annotations: {}
      podAnnotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "80"
        prometheus.io/path: "/api/v1/metrics"
      podLabels:
        app: parseable
        component: prism
      ## Name of an existing Kubernetes PriorityClass for Prism pods.
      priorityClassName: ""
      nodeSelector: {}
      tolerations: []
      affinity: {}
      topologySpreadConstraints: []
      terminationGracePeriodSeconds: 30
      readinessProbe:
        httpGet:
          path: /api/v1/readiness
          port: 8000
        initialDelaySeconds: 5
        timeoutSeconds: 5

  ## -----------------------------------------------------------------------
  ## Parseable resources as code
  ## -----------------------------------------------------------------------
  ## These resources are reconciled on Helm install and upgrade.
  ## Omit a section to leave that resource type unchanged.
  ## When a section is enabled/present, its list or Git folder is the complete
  ## source of truth. Missing resources are deleted, including UI-created ones.
  ## A Git push alone does not apply changes; run helm upgrade.

  ## DATASETS
  ## Required: name, telemetryType, logSource.
  ##   telemetryType: logs | metrics | traces
  ##   logSource: json | otel-logs | otel-metrics | otel-traces
  ## Use matching OpenTelemetry types and sources (logs/otel-logs, etc.).
  ## Optional: tags, retention.durationDays, smartCache.size.
  ##   tags: agent-observability (requires an otel-traces dataset).
  ##   retention.durationDays: 1d-3650d; 0d or "" removes retention.
  ##   smartCache.size: Enterprise only, minimum 10Gi; allow enough hot-tier disk.
  ## Telemetry type and log source are set at creation. Enterprise updates tags;
  ## OSS applies tags at creation. Keep the name stable: changing it creates a
  ## new dataset and deletes the old one, including its data.
  ## With datasets present, datasets absent from the list are deleted.
  ## Omit datasets to keep all existing datasets; datasets: [] deletes all.
  ##
  # datasets:
  #   - name: payment-traces
  #     telemetryType: traces
  #     logSource: otel-traces
  #     tags: [agent-observability]  # Optional
  #     retention:                  # Optional
  #       durationDays: 30d
  #     smartCache:                 # Optional; Enterprise only
  #       size: 10Gi

  ## API KEYS
  ## Required: name, apiKeyType (ingestor | query).
  ##   ingestor: ingest across datasets.
  ##   query: reader access across datasets.
  ## Optional: secretKeyRef for a UUID v4 key stored in a Kubernetes Secret.
  ## For a new key without secretKeyRef, Parseable generates its value and
  ## prints it in Helm/Job output. CI logs can retain it; save it securely.
  ## Keep key values out of values.yaml. A key can be matched for a name change
  ## by its value, or for a value change by its name. Changing apiKeyType
  ## requires revoking and recreating the key.
  ## With apiKeys present, keys absent from the list are revoked.
  ## Omit apiKeys to keep all existing keys; apiKeys: [] revokes all.
  ##
  # apiKeys:
  #   - name: payment-ingest
  #     apiKeyType: ingestor
  #     secretKeyRef:                # Optional; omit to generate a key on terminal
  #       name: parseable-api-keys
  #       key: PAYMENT_KEY
  #   - name: payment-query
  #     apiKeyType: query

  ## DASHBOARDS
  ## Required when enabled: git.repository, git.ref, git.path,
  ## git.secretKeyRef.name, git.secretKeyRef.key.
  ## Store a GitHub token with Contents: read access in a Kubernetes Secret,
  ## including for public repositories. Never put the token in values.yaml.
  ## path is relative to the repository root, it list all dashboard file from there; subfolders are included.
  ## The .json filename becomes the dashboard title: dashboards/payments.json
  ## creates the dashboard "payments".
  ## Git is the source of truth: dashboards absent from the folder are deleted.
  ## A missing folder, no .json files, or invalid JSON fails without deletion.
  ## Omit dashboards or set enabled: false to leave dashboards unchanged.
  ##
  # dashboards:
  #   enabled: true
  #   git:
  #     repository: https://github.com/company/observability-config.git
  #     ref: main
  #     path: dashboards
  #     secretKeyRef:
  #       name: observability-git-access
  #       key: token

  ## ALERT TARGETS
  ## Required: id (26-character ULID), title, type, endpointSecretRef.
  ##   type: slack | webhook | alertManager.
  ## Store endpoints and credentials in Kubernetes Secrets.
  ## Optional by type:
  ##   webhook: skipTlsCheck, customHeaders.
  ##   alertManager: skipTlsCheck, usernameSecretRef and passwordSecretRef
  ##                 together. Slack accepts no additional fields.
  ## Targets are applied before alerts. Keep id and title stable. A title
  ## cannot change in place; changing an ID under the same title requires that
  ## no alert uses the old ID.
  ## With targets present, targets absent from the list are deleted after alerts.
  ## Omit targets to keep all existing targets; targets: [] requests deletion
  ## of all targets (the server can reject deletion of targets in use).
  ##
  # targets:
  #   - id: 01K9QQ9QC51KD43TE4HTJ4MW1D
  #     title: payments-webhook
  #     type: webhook
  #     endpointSecretRef:
  #       name: alert-target-secrets
  #       key: PAYMENTS_URL
  #     skipTlsCheck: false          # Optional
  #     customHeaders:              # Optional; webhook only
  #       X-Team: payments
  #   - id: 01K9QQ9QC51KD43TE4HTJ4MW1E
  #     title: ops-alertmanager
  #     type: alertManager
  #     endpointSecretRef:
  #       name: alert-target-secrets
  #       key: ALERTMANAGER_URL
  #     usernameSecretRef:          # Optional with passwordSecretRef
  #       name: alert-target-secrets
  #       key: ALERTMANAGER_USERNAME
  #     passwordSecretRef:
  #       name: alert-target-secrets
  #       key: ALERTMANAGER_PASSWORD

  ## ALERTS
  ## Required when enabled: git.repository, git.ref, git.path,
  ## git.secretKeyRef.name, git.secretKeyRef.key.
  ## Put exported alert .json files in a GitHub folder. Set git.path to that
  ## folder's path from the repository root (for example, parseable/alerts).
  ## git.secretKeyRef points to a Kubernetes Secret containing a GitHub token
  ## with Contents: read access. To reuse the dashboard token, set the alert
  ## secretKeyRef.name and key to the same values used by dashboards.git.
  ## The token must be able to read both GitHub folders.
  ## Each JSON needs a nonempty targets list of target ULIDs.
  ## Git is the source of truth: alerts absent from the folder are deleted.
  ## A missing folder, no .json files, or invalid JSON fails before changes.
  ## Omit alerts or set enabled: false to leave alerts unchanged.
  ##
  # alerts:
  #   enabled: true
  #   git:
  #     repository: https://github.com/company/observability-config.git
  #     ref: main
  #     path: alerts
  #     secretKeyRef:
  #       name: observability-git-access
  #       key: token

  ## ServiceMonitor for this Parseable deployment. Read more on ServiceMonitor
  ## here: https://prometheus-operator.dev/docs/api-reference/api/#monitoring.coreos.com/v1.ServiceMonitor
  metrics:
    serviceMonitor:
      enabled: false
      labels: {}
      namespace: ""
      interval: 30s
      scrapeTimeout: ""
      path: /api/v1/metrics
      port: http
      relabelings: []
      metricRelabelings: []
