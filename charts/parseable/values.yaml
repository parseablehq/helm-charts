## Parseable Helm chart
## Single chart for both OSS and Enterprise editions of Parseable. OSS and
## Enterprise ship as separate images (see `image` vs `enterprise.image`
## below); which one gets used is controlled by `enterprise.enabled`, not by
## the node type.
##
## Node types map 1:1 to Parseable's P_MODE values and are grouped by mode:
##   standalone.unified   -> P_MODE=all    (OSS only, single all-in-one pod)
##   distributed.ingestor -> P_MODE=ingest (OSS + Enterprise)
##   distributed.querier  -> P_MODE=query  (OSS + Enterprise)
##   distributed.prism    -> P_MODE=prism  (Enterprise only, cluster coordinator)
##
## Each node section is self-contained: its own replicas, env, resources,
## persistence, service and scheduling. There are no shared "common" blocks -
## what you see in a section is everything that applies to that node type.
##
## Docs: https://www.parseable.com/docs/installation/kubernetes-helm

parseable:
  nameOverride: ""
  fullnameOverride: ""

  ## deploymentMode: standalone | distributed
  ## standalone  - a single all-in-one pod (the `standalone.unified` section).
  ##               Simplest way to run Parseable, does not scale horizontally.
  ##               OSS only.
  ## distributed - separate ingestor + querier pods (the `distributed.ingestor`
  ##               / `distributed.querier` sections), plus `distributed.prism`
  ##               when `enterprise.enabled` is true. Required for Enterprise.
  deploymentMode: standalone

  ## OSS image, used by every node type unless enterprise.enabled is true
  ## (see enterprise.image below, which takes over in that case).
  image:
    repository: quay.io/parseablehq/parseable
    tag: "" # defaults to .Chart.AppVersion
    pullPolicy: IfNotPresent
  ## Names of imagePullSecrets for pulling the image above, e.g. from a private registry.
  imagePullSecrets: []

  ## -----------------------------------------------------------------------
  ## Object store
  ## -----------------------------------------------------------------------
  store:
    ## One of: local-store, s3-store, blob-store, gcs-store.
    ## local-store keeps data on the pod's own volumes and only works with
    ## deploymentMode: standalone - it is not valid for distributed deployments.
    type: local-store

    ## Name of a pre-existing Kubernetes Secret holding the connection details
    ## for the selected store type, plus the Parseable admin credentials.
    ## The chart never creates or reads plaintext secrets from values.yaml.
    ##
    ## Create it with kubectl, using the keys expected for your store type:
    ##
    ## local-store:
    ##   kubectl create secret generic parseable-env-secret \
    ##     --from-literal=addr=0.0.0.0:8000 \
    ##     --from-literal=username=admin \
    ##     --from-literal=password=admin
    ##
    ## s3-store with static credentials (adds):
    ##     --from-literal=s3.url=<endpoint> \
    ##     --from-literal=s3.access.key=<key> \
    ##     --from-literal=s3.secret.key=<secret> \
    ##     --from-literal=s3.bucket=<bucket> \
    ##     --from-literal=s3.region=<region>
    ##
    ## AWS IRSA:
    ##   Omit s3.access.key and s3.secret.key from this Secret. Annotate the
    ##   Parseable service account with its IAM role under serviceAccount.annotations.
    ##   The remaining S3 settings (url, bucket, and region) are still required.
    ##
    ## blob-store (adds):
    ##     --from-literal=azr.access_key=<key> \
    ##     --from-literal=azr.account=<account> \
    ##     --from-literal=azr.container=<container> \
    ##     --from-literal=azr.url=<url>
    ##
    ## gcs-store (adds):
    ##     --from-literal=gcs.url=<url> \
    ##     --from-literal=gcs.bucket=<bucket> \
    ##     and a service-account key file, see `store.gcsCredentials` below.
    secretName: parseable-env-secret

    ## Only used when store.type is gcs-store. Points at a Secret containing
    ## the GCS service-account JSON key, which is mounted into every pod.
    ##   kubectl create secret generic parseable-gcs-key \
    ##     --from-file=key.json=<path-to-service-account-key.json>
    gcsCredentials:
      secretName: parseable-gcs-key
      secretKey: key.json
      mountPath: /var/secrets/google

  ## Shared secret used to authenticate intra-cluster requests between nodes.
  ## Required for Enterprise distributed deployments, optional for OSS
  ## distributed deployments, and not used in standalone mode. When enabled,
  ## P_CLUSTER_SECRET is injected into every distributed node from this secret.
  ##   kubectl create secret generic parseable-cluster-secret \
  ##     --from-literal=cluster-secret=<16-char-alphanumeric-string>
  clusterSecret:
    enabled: false
    secretName: parseable-cluster-secret
    secretKey: cluster-secret

  ## -----------------------------------------------------------------------
  ## Enterprise edition
  ## -----------------------------------------------------------------------
  ## Flip `enabled: true` to run Parseable Enterprise instead of OSS. Requires
  ## deploymentMode: distributed. Unlocks the `distributed.prism` node type,
  ## plus license validation and audit logging.
  enterprise:
    enabled: false

    ## Enterprise runs a different image than OSS. Used by every node type
    ## instead of the top-level `image` above whenever enabled is true.
    image:
      repository: quay.io/parseablehq/parseable-enterprise
      tag: "" # defaults to .Chart.AppVersion
      pullPolicy: IfNotPresent
    imagePullSecrets: []

    ## License is validated at startup; the server refuses to start without one.
    ## The license DATA is always mounted read-only from `secretName` at
    ## `mountPath` on every node (P_LICENSE_DATA_FILE_PATH).
    ##   kubectl create secret generic parseable-license \
    ##     --from-file=parseable_license.json=resources/parseable_license.json \
    ##     --from-file=parseable_license.sig=resources/parseable_license.sig
    ##
    ## The license SIGNATURE can be supplied one of two ways:
    ##   source: file   - mounted from `secretName` (P_LICENSE_SIGNATURE_FILE_PATH)
    ##   source: base64 - base64 string from an existing secret via secretKeyRef
    ##                    (P_LICENSE_SIGNATURE_BASE64), e.g.
    ##     kubectl create secret generic parseable-env-secret \
    ##       --from-literal=license.signature.base64=$(base64 -w0 resources/parseable_license.sig)
    license:
      secretName: parseable-license
      mountPath: /tmp/license
      dataKey: parseable_license.json
      signature:
        source: file # file | base64
        ## file mode: key/filename inside `secretName`, mounted at `mountPath`.
        key: parseable_license.sig
        ## base64 mode only: existing secret holding the base64-encoded signature.
        ## Ignored when source is file; uncomment and set when source is base64.
        base64: {}
          # secretName: parseable-env-secret
          # key: license.signature.base64

    ## Ships an audit trail of API activity to another Parseable instance/stream.
    ## Applied to every node type (ingestor/querier/prism).
    auditLogging:
      enabled: false
      server: "http://parseable-querier-service.parseable.svc.cluster.local"
      username: admin
      password: admin
      ## Reference to a Secret key holding the password instead of the
      ## plaintext `password` field above.
      existingSecret:
        name: ""
        key: ""

  ## -----------------------------------------------------------------------
  ## Shared identity / security (applies to every node type's pod)
  ## -----------------------------------------------------------------------
  serviceAccount:
    create: true
    name: "parseable"
    ## For AWS IRSA, for example:
    ## annotations:
    ##   eks.amazonaws.com/role-arn: arn:aws:iam::<account-id>:role/<role-name>
    annotations: {}

  securityContext:
    allowPrivilegeEscalation: false

  ## Pod-level security context. Applied to OSS pods only; Enterprise pods run
  ## as the image's default user (root), which its bundled ML feature needs.
  podSecurityContext:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    fsGroupChangePolicy: "Always"

  ## =========================================================================
  ## Node types
  ## =========================================================================

  ## --- standalone --- (deploymentMode: standalone, OSS only) ---------------
  standalone:
    ## Single StatefulSet pod running every function (ingest + query + storage).
    unified:
      env:
        RUST_LOG: warn
        P_CHECK_UPDATE: "false"
      resources:
        limits:
          cpu: 500m
          memory: 4Gi
        requests:
          cpu: 250m
          memory: 1Gi
      service:
        type: ClusterIP
        port: 80
      persistence:
        ## Data directory used only by local-store. When enabled, it is backed
        ## by a PVC; when disabled, it uses emptyDir. Object-store modes do not
        ## create or mount a data volume regardless of this value.
        data:
          enabled: true
          storageClass: ""
          accessMode: ReadWriteOnce
          size: 5Gi
        ## Staging directory. When enabled, it is backed by a PVC; when
        ## disabled, it uses emptyDir.
        staging:
          enabled: true
          storageClass: ""
          accessMode: ReadWriteOnce
          size: 5Gi
      podAnnotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "80"
        prometheus.io/path: "/api/v1/metrics"
      podLabels:
        app: parseable
        component: standalone
      nodeSelector: {}
      tolerations: []
      affinity: {}
      topologySpreadConstraints: []
      terminationGracePeriodSeconds: 30
      readinessProbe:
        httpGet:
          path: /api/v1/readiness
          port: 8000

  ## --- distributed --- (deploymentMode: distributed) ----------------------
  distributed:
    ## ingestor (OSS + Enterprise) - receives and stages incoming events.
    ingestor:
      replicas: 3
      env:
        RUST_LOG: warn
        P_CHECK_UPDATE: "false"
        # General Kafka Configuration
        # P_KAFKA_BOOTSTRAP_SERVERS: "my-kafka.kafka.svc.cluster.local:9092" # Comma-separated list of Kafka bootstrap servers
        # P_KAFKA_PARTITION_LISTENER_CONCURRENCY: "2" # Number of parallel threads for Kafka partition listeners
        # P_KAFKA_CONSUMER_TOPICS: "test-log-stream-0,test-log-stream-1"
        # P_KAFKA_CLIENT_ID: "parseable-connect" # Client ID for Kafka connection
        # P_CONNECTOR_BAD_DATA_POLICY: "fail" # Default Policy for handling bad data
        # See https://www.parseable.com/docs for the full list of Kafka consumer/security options.
      resources:
        limits:
          cpu: 500m
          memory: 4Gi
        requests:
          cpu: 250m
          memory: 1Gi
      service:
        type: ClusterIP
        port: 80
      ## Local disk for staging incoming events before they are sent to the
      ## object store. When enabled, each ingestor gets a PVC; when disabled,
      ## each ingestor uses emptyDir.
      persistence:
        staging:
          enabled: true
          storageClass: ""
          accessMode: ReadWriteOnce
          size: 5Gi
      podAnnotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "80"
        prometheus.io/path: "/api/v1/metrics"
      podLabels:
        app: parseable
        component: ingestor
      nodeSelector: {}
      tolerations: []
      affinity: {}
      topologySpreadConstraints: []
      terminationGracePeriodSeconds: 30
      readinessProbe:
        httpGet:
          path: /api/v1/readiness
          port: 8000

    ## querier (OSS + Enterprise) - serves queries and the console. OSS supports
    ## a single querier; Enterprise can run multiple queriers behind prism.
    querier:
      replicas: 1
      env:
        RUST_LOG: warn
        P_CHECK_UPDATE: "false"
      resources:
        limits:
          cpu: 500m
          memory: 4Gi
        requests:
          cpu: 250m
          memory: 1Gi
      service:
        type: ClusterIP
        port: 80
      ## Local disk used as the Enterprise hot-tier query cache, mounted at
      ## /parseable/hot-tier. When enabled, each Enterprise querier gets a PVC;
      ## when disabled, it uses emptyDir. Ignored for OSS deployments.
      persistence:
        hotTier:
          enabled: true
          storageClass: ""
          accessMode: ReadWriteOnce
          size: 50Gi
      podAnnotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "80"
        prometheus.io/path: "/api/v1/metrics"
      podLabels:
        app: parseable
        component: querier
      nodeSelector: {}
      tolerations: []
      affinity: {}
      topologySpreadConstraints: []
      terminationGracePeriodSeconds: 30
      readinessProbe:
        httpGet:
          path: /api/v1/readiness
          port: 8000

    ## prism (Enterprise only) - cluster coordinator, fronts the querier fleet.
    ## Deployed automatically whenever enterprise.enabled is true.
    prism:
      replicas: 1
      env:
        RUST_LOG: warn
        P_CHECK_UPDATE: "false"
      resources:
        limits:
          cpu: "1"
          memory: 2Gi
        requests:
          cpu: 500m
          memory: 1Gi
      service:
        type: ClusterIP
        port: 80
      ## Local disk for Prism's own state. Optional.
      persistence:
        enabled: false
        storageClass: ""
        accessMode: ReadWriteOnce
        size: 5Gi
      ## Separate volume for Prism's PromQL results cache, mounted at
      ## /parseable/promql-cache (matches P_PROMQL_RESULTS_CACHE_DIR, which the
      ## chart sets automatically). Falls back to an emptyDir when disabled.
      cache:
        enabled: false
        storageClass: ""
        accessMode: ReadWriteOnce
        size: 5Gi
      podAnnotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "80"
        prometheus.io/path: "/api/v1/metrics"
      podLabels:
        app: parseable
        component: prism
      nodeSelector: {}
      tolerations: []
      affinity: {}
      topologySpreadConstraints: []
      terminationGracePeriodSeconds: 30
      readinessProbe:
        httpGet:
          path: /api/v1/readiness
          port: 8000

  ## Create datasets and set their retention on install/upgrade.
  ## Each dataset requires name, telemetryType, and logSource.
  ## telemetryType: logs, metrics, traces, events.
  ## logSource: json, otel-logs, otel-metrics, otel-traces.
  ## OTel sources require their matching telemetry type. Tags and retention are optional.
  ## Type and source apply at creation only.
  ## Enterprise reconciles tags on upgrade; OSS applies tags on creation only.
  ## Supported tags: agent-observability, k8s-observability,
  ## database-observability.
  ## agent-observability requires an otel-traces dataset.
  ##   - name: "sample-dataset"
  ##     telemetryType: logs
  ##     logSource: json
  ##     tags: ["k8s-observability"]
  ##     retention:
  ##       durationDays: 30d
  ##     smartCache:
  ##       size: 10Gi
  ## Retention accepts 1d to 3650d; 0d or an empty value removes it.
  ## Smart Cache is Enterprise-only. size must be at least 10Gi; the
  ## Enterprise querier hot-tier volume must have enough usable disk space.
  ## Omit datasets to leave them untouched; set datasets: [] to delete all datasets.

  ## Parseable roles to reconcile after datasets are ready.
  ## Existing roles are updated only when their privileges change.
  ## When roles is present, omitted roles are deleted after API keys, users,
  ## and groups reconcile. Omit roles entirely to leave every role untouched.
  ##   - name: application-logs-reader
  ##     defaultOidcRole: true # Optional; at most one role. Omit to keep the current default.
  ##     privileges:
  ##       - privilege: reader
  ##         resource:
  ##           dataset: application-logs
  ## reader/writer/ingestor accept a dataset name, list of names, or all.
  ## Use dataset: all or dataset: [ALL] for all datasets.
  ## admin/editor have no resource; LLM key scopes are not supported yet.
  ## Backend wildcard authorization may also match LLM resources; see README.
  ## roles: [] deletes all user-defined roles. Roles still assigned to users or groups cannot
  ## be deleted until those assignments are removed.

  ## Create native users after roles and API keys are ready.
  ## Use secretKeyRef for a caller-provided password. Omit it to let Parseable
  ## generate a password; the new password is printed once in Helm output.
  ## Generated passwords also appear in Job and CI logs; save them securely.
  ## Existing users keep their password; only their direct roles are reconciled.
  ## Each user needs at least one role to log in; roles: [] is rejected.
  ## Caller-provided passwords must differ, even across Secret fields.
  ## When users is present, only listed native users are kept. Other native
  ## and OAuth users are deleted after reconciliation succeeds. Protected
  ## internal users and API-key-backed users are not deleted by this Job.
  ## Omit users to leave them untouched; users: [] deletes all deletable users.
  ##   - name: application-logs-user
  ##     roles: [application-logs-reader]
  ##     secretKeyRef:
  ##       name: parseable-user-passwords
  ##       key: APPLICATION_LOGS_PASSWORD
  ##   - name: generated-user
  ##     roles: [application-logs-reader]

  ## Enterprise user groups run after users. Group members inherit its roles.
  ## users lists native Parseable usernames; existing OAuth members can be removed.
  ## A present groups list is authoritative: groups omitted from it are deleted.
  ## Omit groups to leave them untouched; groups: [] deletes all groups.
  ##   - name: application-logs-team
  ##     roles: [application-logs-reader]
  ##     users: [application-logs-user]

  ## Register API keys after datasets and roles are ready. Use secretKeyRef for
  ## a caller-provided key, or omit it to let Parseable generate a key. Newly
  ## generated keys are printed once in Helm output and also appear in Job and
  ## CI logs; save them securely. Never put key values directly in values.yaml.
  ## Secret values must be hyphenated UUID v4 strings.
  ## Existing matching keys are left unchanged. Changed roles are reconciled
  ## through the user-role API; roles: [] removes all assigned roles.
  ## A changed API key value fails safely because no key-rotation route exists.
  ## When apiKeys is present, keys omitted from the list are revoked.
  ## Omit apiKeys to leave them untouched; set apiKeys: [] to revoke all API keys.
  ##   - name: application-logs-key
  ##     roles: [application-logs-reader]
  ##     secretKeyRef:
  ##       name: parseable-api-keys
  ##       key: LOGS_KEY
  ##   - name: generated-key
  ##     roles: [application-logs-reader]

  ## ServiceMonitor for this Parseable deployment. Read more on ServiceMonitor
  ## here: https://prometheus-operator.dev/docs/api-reference/api/#monitoring.coreos.com/v1.ServiceMonitor
  metrics:
    serviceMonitor:
      enabled: false
      labels: {}
      namespace: ""
      interval: 30s
      scrapeTimeout: ""
      path: /api/v1/metrics
      port: http
      relabelings: []
      metricRelabelings: []
